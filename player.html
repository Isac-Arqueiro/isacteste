
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Rádio — Player</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:grid;place-items:center;
 padding:20px;background:#090711;color:#f7f2ff;
 font-family:Arial,sans-serif
}
.player{
 width:min(100%,480px);padding:28px;border-radius:25px;
 background:linear-gradient(145deg,#211135,#100b1a);
 border:1px solid #70409b;text-align:center;
 box-shadow:0 20px 60px #0008
}
.logo{font-size:13px;letter-spacing:3px;color:#e879f9}
.cover{
 width:190px;height:190px;margin:25px auto;
 border-radius:22px;display:grid;place-items:center;
 background:linear-gradient(135deg,#9333ea,#211135);
 font-size:70px
}
h1{font-size:23px;overflow-wrap:anywhere}
p{color:#b8aacb;font-size:14px}
#status{color:#54f0b2;font-size:12px}
input[type=range]{width:100%;accent-color:#d946ef}
.controls{display:flex;justify-content:center;align-items:center;gap:20px;margin:25px}
button{
 cursor:pointer;border:1px solid #39284d;border-radius:50%;
 background:#211532;color:white;width:48px;height:48px;font-size:20px
}
#play{width:68px;height:68px;background:#a855f7;border:0;font-size:26px}
.times{display:flex;justify-content:space-between;font-size:12px;color:#b8aacb}
.note{font-size:12px;line-height:1.5;margin-top:22px}
</style>
</head>
<body>
<main class="player">
 <div class="logo">♫ MINHA RÁDIO ONLINE</div>
 <div class="cover">♫</div>
 <div id="status">CONECTANDO À RÁDIO</div>
 <h1 id="title">Aguardando música...</h1>
 <p id="artist">Selecione uma música no site original.</p>

 <audio id="audio"></audio>

 <input id="seek" type="range" min="0" max="1000" value="0">
 <div class="times">
  <span id="current">00:00</span>
  <span id="total">00:00</span>
 </div>

 <div class="controls">
  <button id="back" title="Voltar ao início">↺</button>
  <button id="play" title="Reproduzir ou pausar">▶</button>
  <button id="mute" title="Silenciar">🔊</button>
 </div>

 <p>VOLUME</p>
 <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
 <p class="note">
  Este player usa a biblioteca musical guardada neste navegador.
  Selecione uma faixa na rádio original para sincronizar.
 </p>
</main>

<script>
(async()=>{
const $=id=>document.getElementById(id);
const audio=$('audio');
const DB='MinhaRadioOnlineDB';
const STORE='tracks';
let db,currentId=null,loading=false;
let channel;

function time(s){
 if(!Number.isFinite(s)||s<0)return '00:00';
 return String(Math.floor(s/60)).padStart(2,'0')+':'+
        String(Math.floor(s%60)).padStart(2,'0');
}

function button(){
 $('play').textContent=audio.paused?'▶':'Ⅱ';
}

function openDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB,1);
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}

function getTrack(id){
 return new Promise((resolve,reject)=>{
  const req=db.transaction(STORE,'readonly')
             .objectStore(STORE).get(id);
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}

async function receive(msg){
 if(!msg||loading)return;

 if(msg.type==='track'&&msg.id){
  loading=true;
  try{
   const track=await getTrack(msg.id);
   if(!track){
    $('status').textContent='MÚSICA NÃO ENCONTRADA';
    return;
   }

   audio.pause();
   audio.src=URL.createObjectURL(track.blob);
   audio.load();
   currentId=track.id;
   $('title').textContent=track.name;
   $('artist').textContent=track.playlist||'Minha Rádio';
   $('status').textContent='MÚSICA SINCRONIZADA';

   if(msg.autoplay){
    try{await audio.play()}
    catch(e){$('status').textContent='Clique em ▶ para ouvir'}
   }
  }catch(e){
   $('status').textContent='ERRO AO ABRIR A BIBLIOTECA';
  }finally{
   loading=false;
   button();
  }
 }

 if(msg.type==='stream'&&msg.url){
  currentId=null;
  audio.pause();
  audio.src=msg.url;
  audio.load();
  $('title').textContent='Transmissão ao vivo';
  $('artist').textContent='Minha Rádio Online';
  $('status').textContent='RÁDIO ONLINE';
  if(msg.autoplay)audio.play().catch(()=>{});
 }

 if(msg.type==='play'&&msg.id===currentId){
  audio.play().catch(()=>{});
 }
 if(msg.type==='pause'&&msg.id===currentId){
  audio.pause();
 }
}

try{
 db=await openDB();
 channel=new BroadcastChannel('mro-sync');
 channel.onmessage=e=>receive(e.data);

 // Recupera a última faixa selecionada, caso a rádio
 // tenha enviado a informação antes de abrir esta página.
 const saved=localStorage.getItem('mro-current-track');
 if(saved)await receive(JSON.parse(saved));

 $('status').textContent='CONECTADO À BIBLIOTECA';
}catch(e){
 $('status').textContent='Abra este player pelo site publicado';
}

$('play').onclick=()=>{
 if(audio.paused)audio.play().catch(()=>{});
 else audio.pause();
};
$('back').onclick=()=>{audio.currentTime=0};
$('mute').onclick=()=>{
 audio.muted=!audio.muted;
 $('mute').textContent=audio.muted?'🔇':'🔊';
};
$('volume').oninput=e=>audio.volume=Number(e.target.value);
$('seek').oninput=()=>{
 if(Number.isFinite(audio.duration))
  audio.currentTime=Number($('seek').value)/1000*audio.duration;
};
audio.ontimeupdate=()=>{
 if(Number.isFinite(audio.duration)){
  $('seek').value=audio.currentTime/audio.duration*1000;
  $('current').textContent=time(audio.currentTime);
  $('total').textContent=time(audio.duration);
 }
};
audio.onplay=button;
audio.onpause=button;
audio.volume=.8;
})();
</script>
</body>
</html>
