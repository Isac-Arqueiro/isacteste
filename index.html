<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MIXER PRO</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: auto;
}

/* =====================================================
   HEADER
===================================================== */

header {

    min-height: 65px;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border-bottom: 2px solid #000;

    display: flex;
    align-items: center;

    gap: 8px;

    padding: 8px 15px;

    position: sticky;
    top: 0;

    z-index: 100;

    flex-wrap: wrap;
}

.logo {

    color: #00ff88;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-right: 10px;
}

.top-btn {

    background: #222;

    border: 1px solid #555;

    color: #ddd;

    padding: 9px 12px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 11px;

    font-weight: bold;
}

.top-btn:hover {

    background: #333;
}

.top-btn.green {

    color: #00ff88;

    border-color: #00ff88;
}

.top-btn.red {

    color: #ff5555;

    border-color: #aa3333;
}

.top-btn.blue {

    color: #55aaff;

    border-color: #336699;
}

.status {

    margin-left: auto;

    color: #777;

    font-size: 10px;
}

.status span {

    color: #00ff88;
}

/* =====================================================
   MESA
===================================================== */

.mesa-area {

    padding: 15px;
}

.mesa {

    display: flex;

    gap: 7px;

    align-items: stretch;

    min-width: max-content;
}

/* =====================================================
   CANAL
===================================================== */

.canal {

    width: 155px;

    min-height: 920px;

    background:
        linear-gradient(
            90deg,
            #111,
            #292929,
            #111
        );

    border: 1px solid #444;

    border-radius: 6px;

    padding: 8px;

    box-shadow:
        inset 0 0 15px #000,
        0 5px 15px #000;

    position: relative;
}

.canal.mutado {

    opacity: .45;
}

.canal.solo-canal {

    border-color: #ffd400;

    box-shadow:
        0 0 10px #ffd400,
        inset 0 0 15px #000;
}

/* =====================================================
   CABEÇALHO
===================================================== */

.cabecalho-canal {

    background: #0b0b0b;

    border-bottom: 2px solid #00ff88;

    border-radius: 4px;

    padding: 5px;

    text-align: center;

    margin-bottom: 7px;
}

.cabecalho-canal strong {

    color: #00ff88;

    font-size: 12px;
}

.cabecalho-canal small {

    display: block;

    color: #777;

    font-size: 8px;

    margin-top: 3px;
}

.nome {

    width: 100%;

    margin-top: 5px;

    padding: 5px;

    background: #111;

    color: #00ff88;

    border: 1px solid #444;

    border-radius: 4px;

    text-align: center;

    outline: none;

    font-size: 10px;
}

.nome:focus {

    border-color: #00ff88;
}

/* =====================================================
   SEÇÕES
===================================================== */

.secao {

    border-bottom: 1px solid #3b3b3b;

    padding: 8px 0;
}

.titulo {

    color: #777;

    text-align: center;

    font-size: 8px;

    letter-spacing: 1px;

    margin-bottom: 7px;
}

/* =====================================================
   KNOBS
===================================================== */

.knobs {

    display: flex;

    justify-content: space-around;
}

.knob-box {

    width: 42px;

    text-align: center;
}

.knob {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    position: relative;

    cursor: ns-resize;

    touch-action: none;

    user-select: none;

    background:
        radial-gradient(
            circle at 32% 28%,
            #999,
            #555 32%,
            #181818 70%
        );

    border: 2px solid #080808;

    box-shadow:
        0 3px 5px #000,
        inset 0 1px 3px #aaa;

    transition: transform .05s;
}

.knob::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 11px;

    background: #00ff88;

    top: 3px;

    left: 50%;

    transform: translateX(-50%);

    border-radius: 2px;

    box-shadow:
        0 0 6px #00ff88;
}

.knob-box label {

    display: block;

    color: #aaa;

    font-size: 7px;

    margin-top: 3px;
}

.valor-knob {

    color: #00ff88;

    font-size: 7px;
}

/* =====================================================
   BOTÕES
===================================================== */

.botoes {

    display: flex;

    gap: 4px;
}

.btn {

    flex: 1;

    background: #222;

    color: #aaa;

    border: 1px solid #444;

    border-radius: 4px;

    padding: 7px 2px;

    cursor: pointer;

    font-size: 8px;

    font-weight: bold;
}

.btn:hover {

    background: #333;
}

.btn.play {

    color: #00ff88;
}

.btn.play.ativo {

    background: #00aa55;

    color: white;

    box-shadow:
        0 0 8px rgba(
            0,
            255,
            136,
            .4
        );
}

.btn.mute.ativo {

    background: #e00000;

    color: white;
}

.btn.solo.ativo {

    background: #ffd400;

    color: black;
}

.btn.copy {

    color: #55aaff;
}

.btn.paste {

    color: #ffbb55;
}

/* =====================================================
   ARQUIVO
===================================================== */

.audio-file {

    width: 100%;

    color: #aaa;

    font-size: 7px;
}

.audio-file::file-selector-button {

    background: #222;

    color: #ddd;

    border: 1px solid #555;

    border-radius: 4px;

    padding: 4px;
}

/* =====================================================
   SLIDERS
===================================================== */

.slider {

    width: 100%;

    accent-color: #00ff88;

    cursor: pointer;
}

/* =====================================================
   SEEK
===================================================== */

.player-tempo {

    display: flex;

    justify-content: space-between;

    color: #777;

    font-size: 7px;

    margin-bottom: 4px;
}

.tempo-atual {

    color: #00ff88;
}

.seek {

    width: 100%;

    height: 5px;

    accent-color: #00ff88;

    cursor: pointer;
}

/* =====================================================
   FADER
===================================================== */

.fader-area {

    height: 180px;

    display: flex;

    justify-content: center;

    align-items: center;
}

.fader {

    width: 165px;

    transform: rotate(-90deg);

    accent-color: #00ff88;
}

.valor-fader {

    display: block;

    text-align: center;

    color: #00ff88;

    font-size: 9px;

    margin-top: 4px;
}

/* =====================================================
   METER
===================================================== */

.meter-area {

    height: 150px;

    display: flex;

    justify-content: center;

    align-items: center;
}

.meter {

    width: 17px;

    height: 140px;

    background: #080808;

    border: 1px solid #333;

    padding: 3px;

    display: flex;

    flex-direction: column-reverse;

    gap: 2px;
}

.led {

    width: 100%;

    height: 5px;

    background: #171717;

    border-radius: 2px;
}

.led.verde {

    background: #00ff44;

    box-shadow:
        0 0 6px #00ff44;
}

.led.amarelo {

    background: #ffff00;

    box-shadow:
        0 0 6px #ffff00;
}

.led.vermelho {

    background: #ff2222;

    box-shadow:
        0 0 7px red;
}

/* =====================================================
   MASTER
===================================================== */

.master {

    width: 180px;
}

.master .cabecalho-canal {

    border-color: #ff9900;
}

.master .cabecalho-canal strong {

    color: #ff9900;
}

/* =====================================================
   YOUTUBE
===================================================== */

.youtube-url {

    width: 100%;

    margin-top: 6px;

    padding: 6px;

    background: #111;

    color: white;

    border: 1px solid #444;

    border-radius: 4px;

    font-size: 8px;
}

.youtube-btn {

    width: 100%;

    margin-top: 5px;

    color: #ff5555;
}

.youtube-box {

    margin-top: 8px;

    width: 100%;

    height: 110px;

    background: #000;

    border: 1px solid #333;

    overflow: hidden;
}

.youtube-box iframe {

    width: 100%;

    height: 110px;

    border: 0;
}

/* =====================================================
   ADICIONAR
===================================================== */

.add-canal {

    width: 155px;

    min-height: 920px;

    border: 2px dashed #444;

    border-radius: 6px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    color: #666;

    cursor: pointer;
}

.add-canal:hover {

    color: #00ff88;

    border-color: #00ff88;
}

.add-icon {

    font-size: 45px;
}

/* =====================================================
   CONTROLES GERAIS
===================================================== */

.controle-todos {

    width: 100%;

    background: #111;

    border: 1px solid #333;

    padding: 8px;

    display: flex;

    gap: 5px;

    flex-wrap: wrap;
}

.controle-todos button {

    flex: 1;

    min-width: 90px;

    padding: 9px 5px;

    background: #222;

    border: 1px solid #444;

    border-radius: 4px;

    color: #aaa;

    font-size: 9px;

    font-weight: bold;

    cursor: pointer;
}

/* =====================================================
   MODAL
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    background: rgba(
        0,
        0,
        0,
        .8
    );

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 500;
}

.modal.aberto {

    display: flex;
}

.caixa-modal {

    width: 370px;

    max-width: 90%;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border: 1px solid #555;

    border-radius: 8px;

    padding: 20px;

    box-shadow:
        0 10px 40px #000;
}

.caixa-modal h2 {

    color: #00ff88;

    text-align: center;
}

.input-cena {

    width: 100%;

    padding: 10px;

    background: #111;

    border: 1px solid #555;

    color: white;

    border-radius: 4px;

    margin-bottom: 10px;
}

.lista-cenas {

    max-height: 250px;

    overflow-y: auto;

    margin-top: 15px;
}

.item-cena {

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #1b1b1b;

    border-bottom: 1px solid #333;

    padding: 8px;

    font-size: 10px;
}

.item-cena button {

    background: #333;

    color: white;

    border: 1px solid #555;

    padding: 5px;

    cursor: pointer;
}

</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        MIXER PRO
    </div>

    <button
        class="top-btn green"
        onclick="iniciarAudio()">
        🔊 ÁUDIO
    </button>

    <button
        class="top-btn green"
        onclick="playTodos()">
        ▶ PLAY TODOS
    </button>

    <button
        class="top-btn"
        onclick="pausarTodos()">
        ⏸ PAUSAR TODOS
    </button>

    <button
        class="top-btn red"
        onclick="pararTodos()">
        ⏹ PARAR TODOS
    </button>

    <button
        class="top-btn blue"
        onclick="sincronizarTodos()">
        🔄 SINCRONIZAR
    </button>

    <button
        class="top-btn"
        onclick="adicionarCanal()">
        ＋ CANAL
    </button>

    <button
        class="top-btn"
        onclick="abrirCenas()">
        💾 CENAS
    </button>

    <button
        class="top-btn"
        onclick="salvarCenaRapida()">
        💾 SALVAR
    </button>

    <div class="status">

        ÁUDIO:
        <span id="statusAudio">
            DESLIGADO
        </span>

        &nbsp; | &nbsp;

<!-- =====================================================
     MESA
===================================================== -->

<div class="mesa-area">

    <div
        class="mesa"
        id="mesa">

        <!-- MASTER -->

        <div class="canal master">

            <div class="cabecalho-canal">

            <!-- MASTER EQ -->

            <div class="secao">

                        <div
                            class="knob"
                            data-tipo="masterHigh"

                        </div>

                        </label>

                        </span>

                    </div>


                    <div class="knob-box">

                        <div
                            class="knob"
                            data-tipo="masterMid"

                        </div>

                        <label>

                        </label>

                        <span class="valor-knob">

                        </span>

                    </div>


                    <div class="knob-box">

                        <div
                            class="knob"
                            data-tipo="masterLow"
                            data-valor="0">
                        </div>

                            GRAVE
                        </label>

                            0 dB
                        </span>

            <!-- MASTER FADER -->

            <div class="secao">

                <div class="titulo">

                </div>

                <div class="fader-area">

                    <input
                        id="masterFader"
                        class="fader"
                        type="range"
                        min="0"
                        max="100"
                        value="80">

                </div>

                <span
                    class="valor-fader"
                    id="masterValor">
                    80%
                </span>

            </div>


            <!-- MASTER MUTE -->

            <div class="secao">

                <div class="titulo">
                    MASTER
                </div>

                <button
                    class="btn mute"
                    id="masterMute"
                    onclick="toggleMasterMute()">

                    MUTE

                </button>

            </div>


            <div class="secao">

                <div class="titulo">
                    TRANSPORTE
                </div>

                <div
                    style="
                    color:#777;
                    font-size:8px;
                    text-align:center;
                    line-height:1.8;
                    ">

                    PLAY TODOS<br>
                    PAUSAR TODOS<br>
                    PARAR TODOS

                </div>

            </div>

        </div>


        <!-- BOTÃO ADICIONAR -->

        <div
            class="add-canal"
            id="botaoAdicionar"
            onclick="adicionarCanal()">

            <div class="add-icon">
                ＋
            </div>

            <strong>
                ADICIONAR
            </strong>

            <small>
                NOVO CANAL
            </small>

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL CENAS
===================================================== -->

<div
    class="modal"
    id="modalCenas">

    <div class="caixa-modal">

        <h2>
            💾 CENAS
        </h2>

        <input
            class="input-cena"
            id="nomeCena"
            placeholder="Nome da cena">

        <button
            class="top-btn green"
            style="width:100%"
            onclick="salvarCena()">

            SALVAR CENA

        </button>

        <div
            class="lista-cenas"
            id="listaCenas">
        </div>

        <br>

        <button
            class="top-btn"
            style="width:100%"
            onclick="fecharCenas()">

            FECHAR

        </button>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

let audioContext = null;

let masterGain = null;

let masterHigh = null;
let masterMid = null;
let masterLow = null;

let canais = [];

let numeroCanal = 0;

let canalCopiado = null;

let youtubeAPIPronta = false;


/* =====================================================
   YOUTUBE API
===================================================== */

function onYouTubeIframeAPIReady() {

    youtubeAPIPronta = true;

    console.log(
        "YouTube API pronta."
    );
}


/* =====================================================
   INICIAR AUDIO
===================================================== */

async function iniciarAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        /* MASTER EQ */

        masterHigh =
            audioContext.createBiquadFilter();

        masterHigh.type =
            "highshelf";

        masterHigh.frequency.value =
            6000;


        masterMid =
            audioContext.createBiquadFilter();

        masterMid.type =
            "peaking";

        masterMid.frequency.value =
            1000;

        masterMid.Q.value =
            1;


        masterLow =
            audioContext.createBiquadFilter();

        masterLow.type =
            "lowshelf";

        masterLow.frequency.value =
            120;


        /* MASTER GAIN */

        masterGain =
            audioContext.createGain();


        /* CADEIA MASTER */

        masterHigh.connect(
            masterMid
        );

        masterMid.connect(
            masterLow
        );

        masterLow.connect(
            masterGain
        );

        masterGain.connect(
            audioContext.destination
        );


        aplicarVolumeMaster();
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();
    }


    document.getElementById(
        "statusAudio"
    ).textContent =
        "ATIVO";
}


/* =====================================================
   METER
===================================================== */

function criarMeter() {

    const meter =
        document.createElement(
            "div"
        );

    meter.className =
        "meter";


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const led =
            document.createElement(
                "div"
            );

        led.className =
            "led";

        meter.appendChild(
            led
        );
    }

    return meter;
}


/* =====================================================
   CRIAR CANAL
===================================================== */

function criarCanal() {

    numeroCanal++;

    const numero =
        numeroCanal;


    const canal =
        document.createElement(
            "div"
        );

    canal.className =
        "canal";

    canal.dataset.numero =
        numero;


    canal.innerHTML = `

        <div class="cabecalho-canal">

            <strong>
                CH ${numero}
            </strong>

            <small>
                INPUT ${numero}
            </small>

            <input
                class="nome"
                value="Canal ${numero}">
        </div>


        <!-- FONTE -->

        <div class="secao">

            <div class="titulo">
                FONTE DE ÁUDIO
            </div>

            <input
                type="file"
                class="audio-file"
                accept="audio/*">


            <input
                type="text"
                class="youtube-url"
                placeholder="Link do YouTube">


            <button
                class="btn youtube-btn">

                ▶ ABRIR YOUTUBE

            </button>


            <div class="youtube-box">
            </div>


            <div class="info-arquivo"
                 style="
                 color:#666;
                 font-size:7px;
                 text-align:center;
                 margin-top:5px;
                 ">

                Nenhum áudio selecionado

            </div>

        </div>


        <!-- PLAY -->

        <div class="secao">

            <div class="botoes">

                <button
                    class="btn play">

                    ▶ PLAY

                </button>

            </div>

        </div>


        <!-- SEEK -->

        <div class="secao">

            <div class="titulo">
                PLAYBACK
            </div>

            <div class="player-tempo">

                <span class="tempo-atual">
                    00:00
                </span>

                <span class="tempo-total">
                    00:00
                </span>

            </div>

            <input
                class="seek"
                type="range"
                min="0"
                max="0"
                step="0.01"
                value="0">

        </div>


        <!-- GAIN -->

        <div class="secao">

            <div class="titulo">
                PREAMP
            </div>

            <div class="knobs">

                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="gain"
                        data-valor="0">
                    </div>

                    <label>
                        GAIN
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>

            </div>

        </div>


        <!-- EQ -->

        <div class="secao">

            <div class="titulo">
                EQUALIZADOR
            </div>

            <div class="knobs">

                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="high"
                        data-valor="0">
                    </div>

                    <label>
                        AGUDO
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>


                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="mid"
                        data-valor="0">
                    </div>

                    <label>
                        MÉDIO
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>


                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="low"
                        data-valor="0">
                    </div>

                    <label>
                        GRAVE
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>

            </div>

        </div>


        <!-- PAN -->

        <div class="secao">

            <div class="titulo">
                PAN
            </div>

            <input
                class="slider pan"
                type="range"
                min="-100"
                max="100"
                value="0">

        </div>


        <!-- MUTE SOLO -->

        <div class="secao">

            <div class="botoes">

                <button class="btn solo">
                    SOLO
                </button>

                <button class="btn mute">
                    MUTE
                </button>

            </div>

        </div>


        <!-- LED -->

        <div class="secao">

            <div class="titulo">
                SIGNAL
            </div>

            <div class="meter-area">
            </div>

        </div>


        <!-- FADER -->

        <div class="secao">

            <div class="titulo">
                CHANNEL LEVEL
            </div>

            <div class="fader-area">

                <input
                    class="fader"
                    type="range"
                    min="0"
                    max="100"
                    value="75">

            </div>

            <span class="valor-fader">
                75%
            </span>

        </div>


        <!-- COPIAR -->

        <div class="secao">

            <div class="botoes">

                <button class="btn copy">
                    📋 COPIAR

/* =====================================================
   YOUTUBE ID
===================================================== */

function obterYoutubeId(url) {

    if (!url)
        return null;


    try {

        const u =
            new URL(
                url
            );


        if (
            u.hostname.includes(
                "youtu.be"
            )
        ) {

            return u.pathname
                .replace(
                    "/",
                    ""
                )
                .split("?")[0];

        }


        if (
            u.hostname.includes(
                "youtube.com"
            )
        ) {

            return u.searchParams.get(
                "v"
            );

        }

    } catch(e) {

        return null;
    }


    return null;
}


/* =====================================================
   YOUTUBE
===================================================== */

function carregarYouTube(
    canal
) {

    if (
        !youtubeAPIPronta
    ) {

        alert(
            "A API do YouTube ainda está carregando. Tente novamente."
        );

        return;
    }


    const campo =
        canal.querySelector(
            ".youtube-url"
        );


    const url =
        campo.value.trim();


    const id =
        obterYoutubeId(
            url
        );


    if (!id) {

        alert(
            "Cole um link válido do YouTube."
        );

        return;
    }


    canal.youtubeUrl =
        url;

    canal.youtubeId =
        id;


    /* Para áudio local */

    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}

        canal.source =
            null;

    }


    canal.audioBuffer =
        null;

    canal.playing =
        false;


    const caixa =
        canal.querySelector(
            ".youtube-box"
        );


    caixa.innerHTML = "";


    const div =
        document.createElement(
            "div"
        );


    caixa.appendChild(
        div
    );


    canal.youtubePlayer =
        new YT.Player(
            div,
            {

                width: "155",

                height: "110",

                videoId: id,

                playerVars: {

                    autoplay: 0,

                    controls: 1,

                    playsinline: 1,

                    rel: 0

                },

                events: {

                    onReady:
                    function(event) {

                        const volume =
                            Number(
                                canal.querySelector(
                                    ".fader"
                                ).value
                            );


                        event.target.setVolume(
                            volume
                        );


                        const duracao =
                            event.target
                                .getDuration();


                        const seek =
                            canal.querySelector(
                                ".seek"
                            );


                        seek.max =
                            duracao;


                        seek.value =
                            0;


                        canal.querySelector(
                            ".tempo-total"
                        ).textContent =
                            formatarTempo(
                                duracao
                            );


                        canal.querySelector(
                            ".info-arquivo"
                        ).textContent =
                            "YouTube carregado";

                    },


                    onStateChange:
                    function(event) {

                        if (
                            event.data ===
                            YT.PlayerState.PLAYING
                        ) {

                            canal.playing =
                                true;

                            atualizarBotaoPlay(
                                canal
                            );

                        }


                        if (
                            event.data ===
                            YT.PlayerState.PAUSED
                        ) {

                            canal.playing =
                                false;

                            atualizarBotaoPlay(
                                canal
                            );

                        }


                        if (
                            event.data ===
                            YT.PlayerState.ENDED
                        ) {

                            canal.playing =
                                false;

                            canal.offset =
                                0;

                            atualizarBotaoPlay(
                                canal
                            );

                        }

                    }

                }

            }
        );


    salvarAutomaticamente();
}


/* =====================================================
   CARREGAR ARQUIVO
===================================================== */

async function carregarArquivo(
    arquivo,
    canal
) {

    if (!arquivo)
        return;


    await iniciarAudio();


    const dados =
        await arquivo.arrayBuffer();


    canal.audioBuffer =
        await audioContext.decodeAudioData(
            dados
        );


    canal.fileName =
        arquivo.name;


    canal.youtubePlayer =
        null;

    canal.youtubeUrl =
        "";

    canal.youtubeId =
        "";

    canal.offset =
        0;


    canal.querySelector(
        ".youtube-box"
    ).innerHTML = "";


    const seek =
        canal.querySelector(
            ".seek"
        );


    seek.max =
        canal.audioBuffer.duration;


    seek.value =
        0;


    canal.querySelector(
        ".tempo-total"
    ).textContent =
        formatarTempo(
            canal.audioBuffer.duration
        );


    canal.querySelector(
        ".tempo-atual"
    ).textContent =
        "00:00";


    canal.querySelector(
        ".info-arquivo"
    ).textContent =
        arquivo.name;


    criarAudioCanal(
        canal
    );


    salvarAutomaticamente();
}


/* =====================================================
   CRIAR CADEIA DE ÁUDIO
===================================================== */

function criarAudioCanal(
    canal
) {

    if (
        !canal.audioBuffer
    )
        return;


    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}

    }


    const source =
        audioContext.createBufferSource();


    source.buffer =
        canal.audioBuffer;


    /* GAIN */

    const preamp =
        audioContext.createGain();


    /* EQ */

    const high =
        audioContext.createBiquadFilter();

    high.type =
        "highshelf";

    high.frequency.value =
        6000;


    const mid =
        audioContext.createBiquadFilter();

    mid.type =
        "peaking";

    mid.frequency.value =
        1000;

    mid.Q.value =
        1;


    const low =
        audioContext.createBiquadFilter();

    low.type =
        "lowshelf";

    low.frequency.value =
        120;


    /* VOLUME */

    const channelGain =
        audioContext.createGain();


    /* PAN */

    const panner =
        audioContext.createStereoPanner();


    /* LED */

    const analyser =
        audioContext.createAnalyser();

    analyser.fftSize =
        256;


    /* =================================================
       CADEIA REAL
    ================================================= */

    source.connect(
        preamp
    );

    preamp.connect(
        high
    );

    high.connect(
        mid
    );

    mid.connect(
        low
    );

    low.connect(
        channelGain
    );

    channelGain.connect(
        panner
    );

    panner.connect(
        analyser
    );

    analyser.connect(
        masterHigh
    );


    /* GUARDAR NÓS */

    canal.source =
        source;

    canal.preampGain =
        preamp;

    canal.highFilter =
        high;

    canal.midFilter =
        mid;

    canal.lowFilter =
        low;

    canal.channelGain =
        channelGain;

    canal.panner =
        panner;

    canal.analyser =
        analyser;


    aplicarControlesCanal(
        canal
    );


    iniciarMeter(
        canal
    );
}


/* =====================================================
   PLAY / PAUSE
===================================================== */

async function alternarPlay(
    canal
) {

    /* YOUTUBE */

    if (
        canal.youtubePlayer
    ) {

        try {

            const estado =
                canal.youtubePlayer
                    .getPlayerState();


            if (
                estado ===
                YT.PlayerState.PLAYING
            ) {

                canal.youtubePlayer
                    .pauseVideo();

            } else {

                canal.youtubePlayer
                    .playVideo();

            }

        } catch(e) {}

        return;
    }


    /* LOCAL */

    if (
        !canal.audioBuffer
    ) {

        alert(
            "Escolha um arquivo de áudio ou carregue um vídeo do YouTube."
        );

        return;
    }


    await iniciarAudio();


    if (
        canal.playing
    ) {

        pausarCanal(
            canal
        );

    } else {

        iniciarCanalNaPosicao(
            canal,
            canal.offset
        );

    }
}


/* =====================================================
   INICIAR LOCAL
===================================================== */

function iniciarCanalNaPosicao(
    canal,
    posicao
) {

    criarAudioCanal(
        canal
    );


    posicao =
        Math.max(
            0,
            Math.min(
                posicao,
                canal.audioBuffer.duration
            )
        );


    canal.offset =
        posicao;


    canal.startTime =
        audioContext.currentTime -
        posicao;


    canal.source.start(
        0,
        posicao
    );


    canal.playing =
        true;


    atualizarBotaoPlay(
        canal
    );
}


/* =====================================================
   PAUSAR
===================================================== */

function pausarCanal(
    canal
) {

    if (
        !canal.playing
    )
        return;


    canal.offset =
        audioContext.currentTime -
        canal.startTime;


    canal.offset =
        Math.max(
            0,
            Math.min(
                canal.offset,
                canal.audioBuffer.duration
            )
        );


    try {

        canal.source.stop();

    } catch(e) {}


    canal.source =
        null;


    canal.playing =
        false;


    atualizarBotaoPlay(
        canal
    );
}


/* =====================================================
   REINICIAR POSIÇÃO
===================================================== */

function reiniciarCanalNaPosicao(
    canal,
    posicao
) {

    if (
        !canal.audioBuffer ||
        !canal.playing
    )
        return;


    try {

        canal.source.stop();

    } catch(e) {}


    criarAudioCanal(
        canal
    );


    canal.offset =
        posicao;


    canal.startTime =
        audioContext.currentTime -
        posicao;


    canal.source.start(
        0,
        posicao
    );
}


/* =====================================================
   BOTÃO PLAY
===================================================== */

function atualizarBotaoPlay(
    canal
) {

    const botao =
        canal.querySelector(
            ".play"
        );


    if (
        canal.playing
    ) {

        botao.textContent =
            "⏸ PAUSE";

        botao.classList.add(
            "ativo"
        );

    } else {

        botao.textContent =
            "▶ PLAY";

        botao.classList.remove(
            "ativo"
        );

    }
}


/* =====================================================
   VOLUME
===================================================== */

function atualizarVolumeCanal(
    canal
) {

    if (
        !canal.channelGain
    )
        return;


    const fader =
        Number(
            canal.querySelector(
                ".fader"
            ).value
        );


    const mute =
        canal.querySelector(
            ".mute"
        ).classList.contains(
            "ativo"
        );


    const existeSolo =
        canais.some(
            c =>
                c.querySelector(
                    ".solo"
                ).classList.contains(
                    "ativo"
                )
        );


    const esteSolo =
        canal.querySelector(
            ".solo"
        ).classList.contains(
            "ativo"
        );


    if (
        mute
    ) {

        canal.channelGain.gain.value =
            0;

    } else if (
        existeSolo &&
        !esteSolo
    ) {

        canal.channelGain.gain.value =
            0;

    } else {

        canal.channelGain.gain.value =
            fader / 100;

    }
}


/* =====================================================
   CONTROLES
===================================================== */

function aplicarControlesCanal(
    canal
) {

    if (
        !canal.audioBuffer
    )
        return;


    canal.querySelectorAll(
        ".knob"
    ).forEach(
        knob => {

            const tipo =
                knob.dataset.tipo;


            const valor =
                Number(
                    knob.dataset.valor
                );


            if (
                tipo === "gain" &&
                canal.preampGain
            ) {

                canal.preampGain.gain.value =
                    Math.pow(
                        10,
                        valor / 20
                    );

            }


            if (
                tipo === "high" &&
                canal.highFilter
            ) {

                canal.highFilter.gain.value =
                    valor;

            }


            if (
                tipo === "mid" &&
                canal.midFilter
            ) {

                canal.midFilter.gain.value =
                    valor;

            }


            if (
                tipo === "low" &&
                canal.lowFilter
            ) {

                canal.lowFilter.gain.value =
                    valor;

            }

        }
    );


    if (
        canal.panner
    ) {

        canal.panner.pan.value =
            Number(
                canal.querySelector(
                    ".pan"
                ).value
            ) / 100;

    }


    atualizarVolumeCanal(
        canal
    );
}


/* =====================================================
   KNOB
===================================================== */

function configurarKnob(
    knob
) {

    let valor =
        Number(
            knob.dataset.valor
        );


    let inicioY =
        0;


    let inicioValor =
        0;


    knob.addEventListener(
        "mousedown",
        function(e) {

            inicioY =
                e.clientY;

            inicioValor =
                valor;


            function mover(ev) {

                const diferenca =
                    inicioY -
                    ev.clientY;


                valor =
                    inicioValor +
                    Math.round(
                        diferenca / 5
                    );


                valor =
                    Math.max(
                        -12,
                        Math.min(
                            12,
                            valor
                        )
                    );


                knob.dataset.valor =
                    valor;


                atualizarVisualKnob(
                    knob
                );


                const canal =
                    knob.closest(
                        ".canal"
                    );


                if (
                    canal &&
                    canal.classList.contains(
                        "master"
                    )
                ) {

                    aplicarMasterKnob(
                        knob,
                        valor
                    );

                } else if (
                    canal
                ) {

                    aplicarControlesCanal(
                        canal
                    );

                }


                salvarAutomaticamente();
            }


            function soltar() {

                document.removeEventListener(
                    "mousemove",
                    mover
                );

                document.removeEventListener(
                    "mouseup",
                    soltar
                );
            }


            document.addEventListener(
                "mousemove",
                mover
            );


            document.addEventListener(
                "mouseup",
                soltar
            );
        }
    );


    atualizarVisualKnob(
        knob
    );
}


/* =====================================================
   VISUAL KNOB
===================================================== */

function atualizarVisualKnob(
    knob
) {

    const valor =
        Number(
            knob.dataset.valor
        );


    const graus =
        -135 +
        (
            (valor + 12) /
            24
        ) * 270;


    knob.style.transform =
        `rotate(${graus}deg)`;


    const texto =
        knob.parentElement
            .querySelector(
                ".valor-knob"
            );


    if (texto) {

        texto.textContent =
            valor > 0
                ? "+" + valor + " dB"
                : valor + " dB";
    }
}


/* =====================================================
   MASTER EQ
===================================================== */

function aplicarMasterKnob(
    knob,
    valor
) {

    if (
        !audioContext
    )
        return;


    const tipo =
        knob.dataset.tipo;


    if (
        tipo === "masterHigh" &&
        masterHigh
    ) {

        masterHigh.gain.value =
            valor;
    }


    if (
        tipo === "masterMid" &&
        masterMid
    ) {

        masterMid.gain.value =
            valor;
    }


    if (
        tipo === "masterLow" &&
        masterLow
    ) {

        masterLow.gain.value =
            valor;
    }
}

/* =====================================================
   LED
===================================================== */

function iniciarMeter(
    canal
) {

    if (
        !canal.analyser
    )
        return;


    const meter =
        canal.querySelector(
            ".meter"
        );


    if (!meter)
        return;


    const leds =
        meter.querySelectorAll(
            ".led"
        );


    const dados =
        new Uint8Array(
            canal.analyser.fftSize
        );


    function atualizar() {

        if (
            !canal.analyser
        )
            return;


        canal.analyser
            .getByteTimeDomainData(
                dados
            );


        let soma =
            0;


        for (
            let i = 0;
            i < dados.length;
            i++
        ) {

            const v =
                (
                    dados[i] -
                    128
                ) / 128;


            soma +=
                v * v;
        }


        const rms =
            Math.sqrt(
                soma /
                dados.length
            );


        const nivel =
            Math.min(
                20,
                Math.floor(
                    rms * 80
                )
            );


        leds.forEach(
            (led, i) => {

                led.className =
                    "led";


                if (
                    i < nivel
                ) {

                    if (
                        i < 13
                    ) {

                        led.classList.add(
                            "verde"
                        );

                    } else if (
                        i < 17
                    ) {

                        led.classList.add(
                            "amarelo"
                        );

                    } else {

                        led.classList.add(
                            "vermelho"
                        );
                    }
                }
            }
        );


        requestAnimationFrame(
            atualizar
        );
    }


    atualizar();
}


/* =====================================================
   TEMPO
===================================================== */

function formatarTempo(
    segundos
) {

    if (
        !isFinite(
            segundos
        ) ||
        segundos < 0
    ) {

        return "00:00";
    }


    segundos =
        Math.floor(
            segundos
        );


    const minutos =
        Math.floor(
            segundos / 60
        );


    const segundosRestantes =
        segundos % 60;


    return String(
        minutos
    ).padStart(
        2,
        "0"
    )
    +
    ":"
    +
    String(
        segundosRestantes
    ).padStart(
        2,
        "0"
    );
}


/* =====================================================
   TEMPO CANAL
===================================================== */

function atualizarTempoCanal(
    canal,
    posicao
) {

    const tempo =
        canal.querySelector(
            ".tempo-atual"
        );


    if (tempo) {

        tempo.textContent =
            formatarTempo(
                posicao
            );
    }
}


/* =====================================================
   RELÓGIO
===================================================== */

function atualizarRelogio() {

    canais.forEach(
        canal => {

            /* YouTube */

            if (
                canal.youtubePlayer &&
                canal.playing
            ) {

                try {

                    const atual =
                        canal.youtubePlayer
                            .getCurrentTime();


                    canal.offset =
                        atual;


                    const seek =
                        canal.querySelector(
                            ".seek"
                        );


                    seek.value =
                        atual;


                    atualizarTempoCanal(
                        canal,
                        atual
                    );

                } catch(e) {}
            }


            /* Áudio local */

            else if (
                canal.audioBuffer &&
                canal.playing &&
                audioContext
            ) {

                const posicao =
                    audioContext.currentTime -
                    canal.startTime;


                canal.offset =
                    posicao;


                const seek =
                    canal.querySelector(
                        ".seek"
                    );


                seek.value =
                    posicao;


                atualizarTempoCanal(
                    canal,
                    posicao
                );
            }

        }
    );


    requestAnimationFrame(
        atualizarRelogio
    );
}


atualizarRelogio();

/* =====================================================
   REMOVER
===================================================== */

function removerCanal(
    canal
) {

    const nome =
        canal.querySelector(
            ".nome"
        ).value;


    if (
        !confirm(
            `Remover o canal "${nome}"?`
        )
    )
        return;


    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}
    }


    const indice =
        canais.indexOf(
            canal
        );


    if (
        indice !== -1
    ) {

        canais.splice(
            indice,
            1
        );
    }


    canal.remove();


    atualizarContador();

    atualizarSolos();

    salvarAutomaticamente();
}

) {

/* =====================================================
   PAUSAR TODOS
===================================================== */

function pausarTodos() {

    canais.forEach(
        canal => {

            if (
                canal.youtubePlayer
            ) {

                try {

                    canal.youtubePlayer
                        .pauseVideo();

                } catch(e) {}
            }


            if (
                canal.audioBuffer &&
                canal.playing
            ) {

                pausarCanal(
                    canal
                );
            }

        }
    );


    salvarAutomaticamente();
}


/* =====================================================
   PARAR TODOS
===================================================== */

function pararTodos() {

    canais.forEach(
        canal => {

            if (
                canal.youtubePlayer
            ) {

                try {

                    canal.youtubePlayer
                        .stopVideo();

                } catch(e) {}
            }


            if (
                canal.source
            ) {

                try {

                    canal.source.stop();

                } catch(e) {}
            }


            canal.playing =
                false;


            canal.offset =
                0;


            const seek =
                canal.querySelector(
                    ".seek"
                );


            if (seek) {

                seek.value =
                    0;
            }


            atualizarTempoCanal(
                canal,
                0
            );


            atualizarBotaoPlay(
                canal
            );
        }
    );


    salvarAutomaticamente();
}


/* =====================================================
   SINCRONIZAR
===================================================== */

function sincronizarTodos() {

    let posicao =
        0;


    const canalReferencia =
        canais.find(
            canal =>
                canal.playing
        );


    if (
        canalReferencia
    ) {

        posicao =
            canalReferencia.offset;
    }


    canais.forEach(
        canal => {

            if (
                canal.youtubePlayer
            ) {

                try {

                    canal.youtubePlayer
                        .seekTo(
                            posicao,
                            true
                        );

                } catch(e) {}
            }


            else if (
                canal.audioBuffer
            ) {

                canal.offset =
                    Math.min(
                        posicao,
                        canal.audioBuffer.duration
                    );


                if (
                    canal.playing
                ) {

                    reiniciarCanalNaPosicao(
                        canal,
                        canal.offset
                    );
                }
            }

        }
    );
}

/* =====================================================

===================================================== */

function atualizarListaCenas() {

    const lista =
        document.getElementById(
            "listaCenas"
        );


    lista.innerHTML =
        "";


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    Object.keys(
        cenas
    ).forEach(
        nome => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-cena";


            item.innerHTML = `

                <span>
                    ${nome}
                </span>

                <span>

                    <button
                        onclick="carregarCena('${escaparTexto(nome)}')">
                        CARREGAR
                    </button>

                    <button
                        onclick="excluirCena('${escaparTexto(nome)}')">
                        X
                    </button>

                </span>

            `;


            lista.appendChild(
                item
            );
        }
    );
}


function escaparTexto(
    texto
) {

    return texto
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );
}


/* =====================================================
   CARREGAR CENA
===================================================== */

function carregarCena(
    nome
) {

    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    const estado =
        cenas[nome];


    if (
        !estado
    )
        return;


    document.getElementById(
        "masterFader"
    ).value =
        estado.masterFader;


    document.getElementById(
        "masterValor"
    ).textContent =
        estado.masterFader + "%";


    document.getElementById(
        "masterMute"
    ).classList.toggle(
        "ativo",
        estado.masterMute
    );


    if (
        estado.masterEQ
    ) {

        const knobs =
            document.querySelectorAll(
                ".master .knob"
            );


        estado.masterEQ.forEach(
            (valor, i) => {

                if (
                    knobs[i]
                ) {

                    knobs[i].dataset.valor =
                        valor;

                    atualizarVisualKnob(
                        knobs[i]
                    );

                    aplicarMasterKnob(
                        knobs[i],
                        valor
                    );
                }
            }
        );
    }


    estado.canais.forEach(
        (dados, i) => {

            if (
                !canais[i]
            )
                return;


            const canal =
                canais[i];


            canal.querySelector(
                ".nome"
            ).value =
                dados.nome;


            canal.querySelector(
                ".fader"
            ).value =
                dados.fader;


            canal.querySelector(
                ".valor-fader"
            ).textContent =
                dados.fader + "%";


            canal.querySelector(
                ".pan"
            ).value =
                dados.pan;


            canal.querySelector(
                ".mute"
            ).classList.toggle(
                "ativo",
                dados.mute
            );


            canal.querySelector(
                ".solo"
            ).classList.toggle(
                "ativo",
                dados.solo
            );


            canal.classList.toggle(
                "mutado",
                dados.mute
            );


            canal.classList.toggle(
                "solo-canal",
                dados.solo
            );


            const knobs =
                canal.querySelectorAll(
                    ".knob"
                );


            if (
                dados.knobs
            ) {

                dados.knobs.forEach(
                    (valor, k) => {

                        if (
                            knobs[k]
                        ) {

                            knobs[k].dataset.valor =
                                valor;

                            atualizarVisualKnob(
                                knobs[k]
                            );
                        }
                    }
                );
            }


            canal.offset =
                dados.offset || 0;


            aplicarControlesCanal(
                canal
            );
        }
    );


    aplicarVolumeMaster();

    atualizarSolos();

    fecharCenas();
}
