<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Central de Vídeos</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080808;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
header{
  position:sticky;top:0;z-index:10;
  background:#111;border-bottom:1px solid #292929;
  padding:14px 20px;display:flex;align-items:center;gap:18px
}
.logo{font-size:22px;font-weight:bold;white-space:nowrap}
.logo span{color:#e50914}
.search{display:flex;flex:1;max-width:700px;margin:auto}
.search input{
  width:100%;padding:13px 16px;border:1px solid #444;
  background:#1d1d1d;color:#fff;border-radius:8px 0 0 8px;
  outline:none;font-size:16px
}
.search button{
  border:0;background:#e50914;color:#fff;padding:0 20px;
  border-radius:0 8px 8px 0;font-size:18px;cursor:pointer
}
main{max-width:1400px;margin:auto;padding:20px}
.hero{
  background:linear-gradient(135deg,#181818,#0d0d0d);
  border:1px solid #292929;border-radius:14px;padding:22px;margin-bottom:22px
}
.hero h1{margin:0 0 8px;font-size:28px}
.hero p{margin:0;color:#aaa}
.categories{display:flex;gap:10px;overflow:auto;padding:3px 0 18px}
.categories button{
  flex:0 0 auto;background:#191919;border:1px solid #333;color:#fff;
  padding:10px 16px;border-radius:20px;cursor:pointer
}
.categories button.active,.categories button:hover{background:#e50914;border-color:#e50914}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px}
.section-title h2{margin:0;font-size:21px}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px
}
.card{
  background:#151515;border:1px solid #292929;border-radius:10px;
  overflow:hidden;cursor:pointer;transition:.18s;outline:none
}
.card:hover,.card:focus{transform:scale(1.025);border-color:#e50914}
.thumb{position:relative;background:#222;aspect-ratio:16/9;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:50%;background:#e50914;
  display:grid;place-items:center;font-size:23px;opacity:.92
}
.favorite{
  position:absolute;right:8px;top:8px;border:0;border-radius:50%;
  width:36px;height:36px;background:#111c;color:#fff;font-size:20px;cursor:pointer
}
.favorite.on{color:#ffd000}
.info{padding:12px}
.info h3{font-size:16px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info p{font-size:13px;color:#999;margin:0}
.empty{padding:35px;text-align:center;color:#999;grid-column:1/-1}
.modal{
  display:none;position:fixed;inset:0;background:#000d;z-index:30;
  align-items:center;justify-content:center;padding:20px
}
.modal.show{display:flex}
.player-box{width:min(1000px,100%);background:#111;border:1px solid #333;border-radius:12px;overflow:hidden}
.player-head{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.player-head h2{margin:0;font-size:18px}
.close{background:#333;color:#fff;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.video iframe{width:100%;height:100%;border:0}
.footer{color:#666;text-align:center;padding:35px 0 15px;font-size:12px}

@media(max-width:700px){
  header{flex-wrap:wrap;padding:12px}
  .logo{width:100%}
  .search{max-width:none;width:100%}
  main{padding:12px}
  .hero h1{font-size:23px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .info{padding:9px}
  .info h3{font-size:14px}
}
</style>
</head>
<body>

<header>
  <div class="logo">MINHA <span>TV</span></div>
  <div class="search">
    <input id="search" type="search" placeholder="Pesquisar vídeos..." autocomplete="off">
    <button onclick="buscar()">🔎</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Minha Central de Vídeos</h1>
    <p>Uma interface própria para organizar e assistir seus vídeos.</p>
  </section>

  <div class="categories">
    <button class="active" onclick="categoria('Todos',this)">Todos</button>
    <button onclick="categoria('Música',this)">🎵 Música</button>
    <button onclick="categoria('Filmes',this)">🎬 Filmes</button>
    <button onclick="categoria('Louvores',this)">🙏 Louvores</button>
    <button onclick="categoria('Shows',this)">🎤 Shows</button>
    <button onclick="categoria('Favoritos',this)">⭐ Favoritos</button>
  </div>

  <div class="section-title">
    <h2 id="titulo">Vídeos</h2>
    <span id="contador"></span>
  </div>

  <section id="grid" class="grid"></section>

  <div class="footer">Projeto demonstrativo • HTML + CSS + JavaScript</div>
</main>

<div id="modal" class="modal" onclick="fecharFora(event)">
  <div class="player-box">
    <div class="player-head">
      <h2 id="playerTitle">Vídeo</h2>
      <button class="close" onclick="fechar()">✕ Fechar</button>
    </div>
    <div class="video">
      <iframe id="iframe" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script>
const videos = [
  {id:"dQw4w9WgXcQ",titulo:"Exemplo de vídeo musical",canal:"YouTube",cat:"Música"},
  {id:"9bZkp7q19f0",titulo:"Exemplo de vídeo",canal:"YouTube",cat:"Shows"},
  {id:"aqz-KE-bpKQ",titulo:"Vídeo demonstrativo",canal:"YouTube",cat:"Filmes"},
  {id:"ScMzIvxBSi4",titulo:"Vídeo de exemplo",canal:"YouTube",cat:"Louvores"},
  {id:"ysz5S6PUM-U",titulo:"Outro vídeo para testar",canal:"YouTube",cat:"Música"},
  {id:"M7lc1UVf-VE",titulo:"Teste do player",canal:"YouTube",cat:"Shows"}
];

let lista = [...videos];
let filtro = "Todos";
let favoritos = JSON.parse(localStorage.getItem("meusFavoritos") || "[]");

function render(){
  const grid=document.getElementById("grid");
  grid.innerHTML="";
  let termo=document.getElementById("search").value.toLowerCase().trim();

  let resultado=lista.filter(v=>{
    const okCat=filtro==="Todos" || v.cat===filtro ||
      (filtro==="Favoritos" && favoritos.includes(v.id));
    const okBusca=!termo || (v.titulo+" "+v.canal+" "+v.cat).toLowerCase().includes(termo);
    return okCat && okBusca;
  });

  document.getElementById("contador").textContent=resultado.length+" vídeo(s)";
  document.getElementById("titulo").textContent=filtro==="Todos"?"Vídeos":filtro;

  if(!resultado.length){
    grid.innerHTML='<div class="empty">Nenhum vídeo encontrado.</div>';
    return;
  }

  resultado.forEach((v,i)=>{
    const card=document.createElement("article");
    card.className="card";
    card.tabIndex=0;
    card.innerHTML=`
      <div class="thumb">
        <img src="https://img.youtube.com/vi/${v.id}/hqdefault.jpg" alt="">
        <div class="play">▶</div>
        <button class="favorite ${favoritos.includes(v.id)?"on":""}" title="Favorito">
          ${favoritos.includes(v.id)?"★":"☆"}
        </button>
      </div>
      <div class="info">
        <h3>${v.titulo}</h3>
        <p>${v.canal} • ${v.cat}</p>
      </div>`;

    card.querySelector(".favorite").addEventListener("click",e=>{
      e.stopPropagation();toggleFavorito(v.id);render();
    });
    card.addEventListener("click",()=>abrir(v));
    card.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();abrir(v)}
    });
    grid.appendChild(card);
  });
}

function buscar(){render()}
document.getElementById("search").addEventListener("input",render);

function categoria(cat,btn){
  filtro=cat;
  document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function toggleFavorito(id){
  if(favoritos.includes(id)) favoritos=favoritos.filter(x=>x!==id);
  else favoritos.push(id);
  localStorage.setItem("meusFavoritos",JSON.stringify(favoritos));
}

function abrir(v){
  document.getElementById("playerTitle").textContent=v.titulo;
  document.getElementById("iframe").src="https://www.youtube.com/embed/"+v.id+"?autoplay=1";
  document.getElementById("modal").classList.add("show");
}

function fechar(){
  document.getElementById("iframe").src="";
  document.getElementById("modal").classList.remove("show");
}
function fecharFora(e){
  if(e.target.id==="modal") fechar();
}
document.addEventListener("keydown",e=>{if(e.key==="Escape")fechar()});

render();
</script>
</body>
</html>
