<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>MIXER PRO</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: auto;
}

/* =====================================================
   HEADER
===================================================== */

header {

    min-height: 65px;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border-bottom: 2px solid #000;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 15px;

    position: sticky;

    top: 0;

    z-index: 100;

    flex-wrap: wrap;
}

.logo {

    color: #00ff88;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-right: 10px;
}

.top-btn {

    background: #222;

    border: 1px solid #555;

    color: #ddd;

    padding: 9px 12px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 11px;

    font-weight: bold;
}

.top-btn:hover {

    background: #333;
}

.top-btn.green {

    color: #00ff88;

    border-color: #00ff88;
}

.top-btn.red {

    color: #ff5555;

    border-color: #aa3333;
}

.top-btn.blue {

    color: #55aaff;

    border-color: #336699;
}

.status {

    margin-left: auto;

    color: #777;

    font-size: 10px;
}

.status span {

    color: #00ff88;
}

/* =====================================================
   MESA
===================================================== */

.mesa-area {

    padding: 15px;
}

.mesa {

    display: flex;

    gap: 7px;

    align-items: stretch;

    min-width: max-content;
}

/* =====================================================
   CANAL
===================================================== */

.canal {

    width: 155px;

    min-height: 930px;

    background:
        linear-gradient(
            90deg,
            #111,
            #292929,
            #111
        );

    border: 1px solid #444;

    border-radius: 6px;

    padding: 8px;

    box-shadow:
        inset 0 0 15px #000,
        0 5px 15px #000;

    position: relative;
}

.canal.mutado {

    opacity: .45;
}

.canal.solo-canal {

    border-color: #ffd400;

    box-shadow:
        0 0 10px #ffd400,
        inset 0 0 15px #000;
}

/* =====================================================
   CABEÇALHO
===================================================== */

.cabecalho-canal {

    background: #0b0b0b;

    border-bottom: 2px solid #00ff88;

    border-radius: 4px;

    padding: 5px;

    text-align: center;

    margin-bottom: 7px;
}

.cabecalho-canal strong {

    color: #00ff88;

    font-size: 12px;
}

.cabecalho-canal small {

    display: block;

    color: #777;

    font-size: 8px;

    margin-top: 3px;
}

.nome {

    width: 100%;

    margin-top: 5px;

    padding: 5px;

    background: #111;

    color: #00ff88;

    border: 1px solid #444;

    border-radius: 4px;

    text-align: center;

    outline: none;

    font-size: 10px;
}

.nome:focus {

    border-color: #00ff88;
}

/* =====================================================
   SEÇÕES
===================================================== */

.secao {

    border-bottom: 1px solid #3b3b3b;

    padding: 8px 0;
}

.titulo {

    color: #777;

    text-align: center;

    font-size: 8px;

    letter-spacing: 1px;

    margin-bottom: 7px;
}

/* =====================================================
   BOTÕES
===================================================== */

.botoes {

    display: flex;

    gap: 4px;
}

.btn {

    flex: 1;

    background: #222;

    color: #aaa;

    border: 1px solid #444;

    border-radius: 4px;

    padding: 7px 2px;

    cursor: pointer;

    font-size: 8px;

    font-weight: bold;
}

.btn:hover {

    background: #333;
}

.btn.play {

    color: #00ff88;
}

.btn.play.ativo {

    background: #00aa55;

    color: white;

    box-shadow:
        0 0 8px rgba(0,255,136,.4);
}

.btn.mute.ativo {

    background: #e00000;

    color: white;
}

.btn.solo.ativo {

    background: #ffd400;

    color: black;
}

.btn.copy {

    color: #55aaff;
}

.btn.paste {

    color: #ffbb55;
}

.btn.efeitos {

    color: #cc99ff;
}

.btn.efeito-ativo {

    background: #00aa55;

    color: white;
}

/* =====================================================
   KNOBS
===================================================== */

.knobs {

    display: flex;

    justify-content: space-around;
}

.knob-box {

    width: 42px;

    text-align: center;
}

.knob {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    position: relative;

    cursor: ns-resize;

    touch-action: none;

    user-select: none;

    background:
        radial-gradient(
            circle at 32% 28%,
            #999,
            #555 32%,
            #181818 70%
        );

    border: 2px solid #080808;

    box-shadow:
        0 3px 5px #000,
        inset 0 1px 3px #aaa;

    transform-origin: center center;
}

.knob::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 11px;

    background: #00ff88;

    top: 3px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius: 2px;

    box-shadow:
        0 0 6px #00ff88;
}

.knob-box label {

    display: block;

    color: #aaa;

    font-size: 7px;

    margin-top: 3px;
}

.valor-knob {

    color: #00ff88;

    font-size: 7px;
}

/* =====================================================
   SLIDERS
===================================================== */

.slider {

    width: 100%;

    accent-color: #00ff88;

    cursor: pointer;
}

.seek {

    width: 100%;

    height: 5px;

    accent-color: #00ff88;

    cursor: pointer;
}

.player-tempo {

    display: flex;

    justify-content: space-between;

    color: #777;

    font-size: 7px;

    margin-bottom: 4px;
}

.tempo-atual {

    color: #00ff88;
}

.fader-area {

    height: 190px;

    display: flex;

    justify-content: center;

    align-items: center;
}

.fader {

    width: 175px;

    transform: rotate(-90deg);

    accent-color: #00ff88;
}

.valor-fader {

    display: block;

    text-align: center;

    color: #00ff88;

    font-size: 9px;

    margin-top: 4px;
}

/* =====================================================
   METER
===================================================== */

.meter-area {

    height: 150px;

    display: flex;

    justify-content: center;

    align-items: center;
}

.meter {

    width: 17px;

    height: 140px;

    background: #080808;

    border: 1px solid #333;

    padding: 3px;

    display: flex;

    flex-direction: column-reverse;

    gap: 2px;
}

.led {

    width: 100%;

    height: 5px;

    background: #171717;

    border-radius: 2px;
}

.led.verde {

    background: #00ff44;

    box-shadow:
        0 0 6px #00ff44;
}

.led.amarelo {

    background: #ffff00;

    box-shadow:
        0 0 6px #ffff00;
}

.led.vermelho {

    background: #ff2222;

    box-shadow:
        0 0 7px red;
}

/* =====================================================
   ARQUIVO
===================================================== */

.audio-file {

    width: 100%;

    color: #aaa;

    font-size: 7px;
}

.audio-file::file-selector-button {

    background: #222;

    color: #ddd;

    border: 1px solid #555;

    border-radius: 4px;

    padding: 4px;

    cursor: pointer;
}

.youtube-url {

    width: 100%;

    margin-top: 6px;

    padding: 6px;

    background: #111;

    color: white;

    border: 1px solid #444;

    border-radius: 4px;

    font-size: 8px;
}

.youtube-player {

    width: 1px;

    height: 1px;

    position: absolute;

    left: -9999px;

    top: -9999px;

    overflow: hidden;
}

.info-arquivo {

    color: #666;

    font-size: 7px;

    text-align: center;

    margin-top: 4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

/* =====================================================
   ADD CANAL
===================================================== */

.add-canal {

    width: 155px;

    min-height: 930px;

    border: 2px dashed #444;

    border-radius: 6px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    color: #666;

    cursor: pointer;
}

.add-canal:hover {

    color: #00ff88;

    border-color: #00ff88;
}

.add-icon {

    font-size: 45px;
}

/* =====================================================
   MASTER
===================================================== */

.master {

    width: 180px;
}

.master .cabecalho-canal {

    border-color: #ff9900;
}

.master .cabecalho-canal strong {

    color: #ff9900;
}

/* =====================================================
   REMOVE
===================================================== */

.remove {

    width: 100%;

    color: #ff5555;
}

/* =====================================================
   MODAIS
===================================================== */

.modal {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.8);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 500;
}

.modal.aberto {

    display: flex;
}

.caixa-modal {

    width: 400px;

    max-width: 90%;

    max-height: 90vh;

    overflow-y: auto;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border: 1px solid #555;

    border-radius: 8px;

    padding: 20px;

    box-shadow:
        0 10px 40px #000;
}

.caixa-modal h2 {

    color: #00ff88;

    text-align: center;

    margin-top: 0;
}

.input-cena {

    width: 100%;

    padding: 10px;

    background: #111;

    border: 1px solid #555;

    color: white;

    border-radius: 4px;

    margin-bottom: 10px;
}

.lista-cenas {

    max-height: 250px;

    overflow-y: auto;

    margin-top: 15px;
}

.item-cena {

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #1b1b1b;

    border-bottom: 1px solid #333;

    padding: 8px;

    font-size: 10px;
}

.item-cena button {

    background: #333;

    color: white;

    border: 1px solid #555;

    padding: 5px;

    cursor: pointer;

    margin-left: 3px;

    border-radius: 3px;
}

/* =====================================================
   EFEITOS
===================================================== */

.efeito-controles {

    margin-top: 10px;
}

.efeito-bloco {

    background: #151515;

    border: 1px solid #333;

    padding: 8px;

    margin-bottom: 7px;

    border-radius: 4px;
}

.efeito-bloco strong {

    display: block;

    color: #00ff88;

    font-size: 9px;

    margin-bottom: 5px;
}

/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:700px) {

    header {

        position: relative;
    }

    .status {

        width: 100%;

        margin-left: 0;
    }

}

</style>

</head>

<body>

<header>

    <div class="logo">
        MIXER PRO
    </div>

    <button
        class="top-btn green"
        onclick="iniciarAudio()"
    >
        🔊 ÁUDIO
    </button>

    <button
        class="top-btn green"
        onclick="playTodos()"
    >
        ▶ PLAY TODOS
    </button>

    <button
        class="top-btn"
        onclick="pausarTodos()"
    >
        ⏸ PAUSAR TODOS
    </button>

    <button
        class="top-btn red"
        onclick="pararTodos()"
    >
        ⏹ PARAR TODOS
    </button>

    <button
        class="top-btn blue"
        onclick="sincronizarTodos()"
    >
        🔄 SINCRONIZAR
    </button>

    <button
        class="top-btn"
        onclick="adicionarCanal()"
    >
        ＋ CANAL
    </button>

    <button
        class="top-btn"
        onclick="abrirCenas()"
    >
        💾 CENAS
    </button>

    <button
        class="top-btn"
        onclick="salvarCenaRapida()"
    >
        💾 SALVAR
    </button>

    <button
        class="top-btn blue"
        onclick="compartilharMesa()"
    >

    </button>

    <div class="status">

        ÁUDIO:
        <span id="statusAudio">
            DESLIGADO
        </span>

        &nbsp; | &nbsp;

        CANAIS:

        </span>

    </div>

</header>


<div class="mesa-area">

    <div
        class="mesa"
        id="mesa"
    >

        <div
            class="add-canal"
            id="botaoAdicionar"
            onclick="adicionarCanal()"
        >

            <div class="add-icon">
                ＋
            </div>

            <strong>
                ADICIONAR
            </strong>

            <small>
                NOVO CANAL
            </small>

        </div>


        <!-- =================================================
             MASTER
        ================================================== -->

        <div class="canal master">

            <div class="cabecalho-canal">

                <strong>
                    MASTER
                </strong>

                <small>
                    MAIN OUT
                </small>

            </div>


            <div class="secao">

                <div class="titulo">
                    MASTER EQ
                </div>

                <div class="knobs">

                    <div class="knob-box">

                        <div
                            class="knob"
                            data-tipo="masterHigh"
                            data-valor="0"
                        ></div>

                        <label>
                            AGUDO
                        </label>

                        <span class="valor-knob">
                            0 dB
                        </span>

                    </div>


                    <div class="knob-box">

                        <div
                            class="knob"
                            data-tipo="masterMid"
                            data-valor="0"
                        ></div>

                        <label>
                            MÉDIO
                        </label>

                        <span class="valor-knob">
                            0 dB
                        </span>

                    </div>


                    <div class="knob-box">

                        <div
                            class="knob"
                            data-tipo="masterLow"
                            data-valor="0"
                        ></div>

                        <label>
                            GRAVE

            <div class="secao">

                <div class="titulo">
                    MASTER LEVEL
                </div>

                <div class="fader-area">

                    <input
                        id="masterFader"
                        class="fader"
                        type="range"
                        min="0"
                        max="100"
                        value="80"
                    >

                </div>

                <span
                    class="valor-fader"
                    id="masterValor"
                >
                    80%
                </span>

            </div>


            <div class="secao">

                <div class="titulo">
                    MASTER
                </div>

                <button
                    class="btn mute"
                    id="masterMute"
                    onclick="toggleMasterMute()"
                >
                    MUTE
                </button>

            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL EFEITOS
===================================================== -->

<div
    class="modal"
    id="modalEfeitos"
>

    <div class="caixa-modal">

        <h2>
            🎛️ EFEITOS
        </h2>

        <div id="efeitosCanal">

            <div class="secao">

                <div class="titulo">
                    SELECIONAR EFEITOS
                </div>

                <div class="botoes">

                    <button
                        class="btn"
                        id="btnGate"
                        onclick="toggleEfeito('gate')"
                    >
                        GATE
                    </button>

                    <button
                        class="btn"
                        id="btnCompressor"
                        onclick="toggleEfeito('compressor')"
                    >
                        COMP
                    </button>

                    <button
                        class="btn"
                        id="btnReverb"
                        onclick="toggleEfeito('reverb')"
                    >
                        REVERB
                    </button>

                    <button
                        class="btn"
                        id="btnDelay"
                        onclick="toggleEfeito('delay')"
                    >
                        DELAY
                    </button>

                </div>

            </div>

            <div
                class="efeito-controles"
                id="controlesEfeitos"
            ></div>

        </div>

        <br>

        <button
            class="top-btn"
            style="width:100%"
            onclick="fecharEfeitos()"
        >
            FECHAR
        </button>

    </div>

</div>


<!-- =====================================================
     MODAL CENAS
===================================================== -->

<div
    class="modal"
    id="modalCenas"
>

    <div class="caixa-modal">

        <h2>
            💾 CENAS
        </h2>

        <input
            class="input-cena"
            id="nomeCena"
            placeholder="Nome da cena"
        >

        <button
            class="top-btn green"
            style="width:100%"
            onclick="salvarCena()"
        >
            SALVAR CENA
        </button>

        <div
            class="lista-cenas"
            id="listaCenas"
        ></div>

        <br>

        <button
            class="top-btn"
            style="width:100%"
            onclick="fecharCenas()"
        >
            FECHAR
        </button>

    </div>

</div>


<script>

/* =====================================================
   MIXER PRO
===================================================== */

let audioContext = null;

let masterGain = null;
let masterHigh = null;
let masterMid = null;
let masterLow = null;

let canais = [];

let numeroCanal = 0;

let canalCopiado = null;

let canalEfeitosAtual = null;

let youtubeAPIPronta = false;


/* =====================================================
   YOUTUBE API
===================================================== */

function onYouTubeIframeAPIReady() {

    youtubeAPIPronta = true;

    console.log(
        "YouTube API pronta."
    );
}


/* =====================================================
   INICIAR ÁUDIO
===================================================== */

async function iniciarAudio() {

    if (!audioContext) {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioContext) {

            alert(
                "Seu navegador não suporta Web Audio API."
            );

            return;
        }

        audioContext =
            new AudioContext();


        masterHigh =
            audioContext.createBiquadFilter();

        masterHigh.type =
            "highshelf";

        masterHigh.frequency.value =
            6000;


        masterMid =
            audioContext.createBiquadFilter();

        masterMid.type =
            "peaking";

        masterMid.frequency.value =
            1000;

        masterMid.Q.value =
            1;


        masterLow =
            audioContext.createBiquadFilter();

        masterLow.type =
            "lowshelf";

        masterLow.frequency.value =
            120;


        masterGain =
            audioContext.createGain();


        masterHigh.connect(
            masterMid
        );

        masterMid.connect(
            masterLow
        );

        masterLow.connect(
            masterGain
        );

        masterGain.connect(
            audioContext.destination
        );

        aplicarVolumeMaster();
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();
    }


    document.getElementById(
        "statusAudio"
    ).textContent =
        "ATIVO";
}


/* =====================================================
   METER
===================================================== */

function criarMeter() {

    const meter =
        document.createElement(
            "div"
        );

    meter.className =
        "meter";


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const led =
            document.createElement(
                "div"
            );

        led.className =
            "led";

        meter.appendChild(
            led
        );
    }


    return meter;
}


/* =====================================================
   CRIAR CANAL
===================================================== */

function criarCanal() {

    numeroCanal++;

    const numero =
        numeroCanal;


    const canal =
        document.createElement(
            "div"
        );

    canal.className =
        "canal";

    canal.dataset.numero =
        numero;


    canal.innerHTML = `

        <div class="secao">

            <div class="titulo">
                ÁUDIO / YOUTUBE
            </div>

            <input
                type="file"
                class="audio-file"
                accept="audio/*"
            >

            <input
                type="text"
                class="youtube-url"
                placeholder="Cole aqui o link do YouTube"
            >

            <button
                class="btn youtube-btn"
                style="
                    width:100%;
                    margin-top:5px;
                    color:#ff5555;
                "
            >
                ▶ CARREGAR YOUTUBE
            </button>

            <div class="youtube-player"></div>

            <div class="info-arquivo">
                Nenhum áudio selecionado
            </div>

        </div>


        <div class="cabecalho-canal">

            <strong>
                CH ${numero}
            </strong>

            <small>
                INPUT ${numero}
            </small>

            <input
                class="nome"
                value="Canal ${numero}"
            >

        </div>


        <div class="secao">

            <div class="titulo">
                DELAY
            </div>

            <label style="
                font-size:7px;
                color:#aaa;
            ">
                TEMPO
            </label>

            <input
                class="slider delay-time"
                type="range"
                min="0"
                max="1000"
                value="300"
            >

            <div
                class="delay-time-value"
                style="
                    text-align:center;
                    color:#00ff88;
                    font-size:7px;
                "
            >
                300 ms
            </div>


            <label style="
                font-size:7px;
                color:#aaa;
            ">
                MIX
            </label>

            <input
                class="slider delay-mix"
                type="range"
                min="0"
                max="100"
                value="0"
            >

            <div
                class="delay-mix-value"
                style="
                    text-align:center;
                    color:#00ff88;
                    font-size:7px;
                "
            >
                0%
            </div>


            <label style="
                font-size:7px;
                color:#aaa;
            ">
                FEEDBACK
            </label>

            <input
                class="slider delay-feedback"
                type="range"
                min="0"
                max="90"
                value="20"
            >

            <div
                class="delay-feedback-value"
                style="
                    text-align:center;
                    color:#00ff88;
                    font-size:7px;
                "
            >
                20%
            </div>

        </div>


        <div class="secao">

            <button class="btn efeitos">
                🎛️ EFEITOS
            </button>

        </div>


        <div class="secao">

            <div class="botoes">

                <button class="btn play">
                    ▶ PLAY
                </button>

            </div>

        </div>

/* =====================================================
   YOUTUBE ID
===================================================== */

function obterYoutubeId(url) {

    if (!url) {
        return null;
    }


    try {

        const endereco =
            new URL(url);


        if (
            endereco.hostname.includes(
                "youtube.com"
            )
        ) {

            return endereco.searchParams.get(
                "v"
            );

        }


        if (
            endereco.hostname.includes(
                "youtu.be"
            )
        ) {

            return endereco.pathname
                .substring(1);

        }

    } catch(e) {

        return null;

    }


    return null;
}


/* =====================================================
   CARREGAR YOUTUBE
===================================================== */

function carregarYouTube(canal) {

    if (!youtubeAPIPronta) {

        alert(
            "A API do YouTube ainda está carregando. Aguarde alguns segundos."
        );

        return;
    }


    const campo =
        canal.querySelector(
            ".youtube-url"
        );


    const url =
        campo.value.trim();


    if (!url) {

        alert(
            "Cole primeiro um link do YouTube."
        );

        return;
    }


    const id =
        obterYoutubeId(
            url
        );


    if (!id) {

        alert(
            "Link do YouTube inválido."
        );

        return;
    }


    canal.youtubeUrl =
        url;

    canal.youtubeId =
        id;


    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}

        canal.source =
            null;
    }


    canal.audioBuffer =
        null;


    const playerDiv =
        canal.querySelector(
            ".youtube-player"
        );


    playerDiv.innerHTML =
        "";


    const playerElement =
        document.createElement(
            "div"
        );


    playerDiv.appendChild(
        playerElement
    );


    try {

        canal.ytPlayer =
            new YT.Player(
                playerElement,
                {

                    width: "1",

                    height: "1",

                    videoId: id,

                    playerVars: {

                        autoplay: 0,

                        controls: 0,

                        modestbranding: 1,

                        rel: 0

                    },

                    events: {

                        onReady:
                        function() {

                            const duracao =
                                canal.ytPlayer
                                    .getDuration();


                            const seek =
                                canal.querySelector(
                                    ".seek"
                                );


                            seek.max =
                                duracao;


                            seek.value =
                                0;


                            canal.querySelector(
                                ".tempo-total"
                            ).textContent =
                                formatarTempo(
                                    duracao
                                );


                            const volume =
                                Number(
                                    canal.querySelector(
                                        ".fader"
                                    ).value
                                );


                            canal.ytPlayer.setVolume(
                                volume
                            );


                            canal.querySelector(
                                ".info-arquivo"
                            ).textContent =
                                "YouTube carregado";

                        },


                        onStateChange:
                        function(event) {

                            if (
                                event.data ===
                                YT.PlayerState.PLAYING
                            ) {

                                canal.playing =
                                    true;

                            }


                            if (
                                event.data ===
                                YT.PlayerState.PAUSED
                            ) {

                                canal.playing =
                                    false;

                            }


                            if (
                                event.data ===
                                YT.PlayerState.ENDED
                            ) {

                                canal.playing =
                                    false;

                                canal.offset =
                                    0;

                            }


                            atualizarBotaoPlay(
                                canal
                            );

                        }

                    }

                }
            );

    } catch(e) {

        console.error(e);

        alert(
            "Não foi possível criar o player do YouTube."
        );

    }


    salvarAutomaticamente();
}


/* =====================================================
   CARREGAR ARQUIVO
===================================================== */

async function carregarArquivo(
    arquivo,
    canal
) {

    if (!arquivo) {
        return;
    }


    try {

        await iniciarAudio();


        const dados =
            await arquivo.arrayBuffer();


        canal.audioBuffer =
            await audioContext.decodeAudioData(
                dados
            );


        canal.fileName =
            arquivo.name;


        canal.youtubeUrl =
            "";

        canal.youtubeId =
            "";

        canal.ytPlayer =
            null;


        canal.offset =
            0;


        const seek =
            canal.querySelector(
                ".seek"
            );


        seek.max =
            canal.audioBuffer.duration;


        seek.value =
            0;


        canal.querySelector(
            ".tempo-total"
        ).textContent =
            formatarTempo(
                canal.audioBuffer.duration
            );


        canal.querySelector(
            ".tempo-atual"

            ".info-arquivo"

        );


    } catch(e) {

        console.error(e);

        alert(

        );

    }
}


/* =====================================================
   CADEIA DE ÁUDIO
===================================================== */

function criarAudioCanal(canal) {

    if (
        !canal.audioBuffer ||
        !audioContext
    ) {
        return;
    }


    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}

    }


    const source =
        audioContext.createBufferSource();


    source.buffer =
        canal.audioBuffer;


    const preamp =
        audioContext.createGain();


    const channelGain =
        audioContext.createGain();


    const high =
        audioContext.createBiquadFilter();

    high.type =
        "highshelf";

    high.frequency.value =
        6000;


    const mid =
        audioContext.createBiquadFilter();

    mid.type =
        "peaking";

    mid.frequency.value =
        1000;

    mid.Q.value =
        1;


    const low =
        audioContext.createBiquadFilter();

    low.type =
        "lowshelf";

    low.frequency.value =
        120;


    const panner =
        audioContext.createStereoPanner();


    const analyser =
        audioContext.createAnalyser();

    analyser.fftSize =
        256;


    const delay =
        audioContext.createDelay(
            2
        );


    const delayFeedback =
        audioContext.createGain();


    const delayMix =
        audioContext.createGain();


    delay.delayTime.value =
        Number(
            canal.querySelector(
                ".delay-time"
            ).value
        ) / 1000;


    delayFeedback.gain.value =
        Number(
            canal.querySelector(
                ".delay-feedback"
            ).value
        ) / 100;


    delayMix.gain.value =
        Number(
            canal.querySelector(
                ".delay-mix"
            ).value
        ) / 100;


    source.connect(
        preamp
    );

    preamp.connect(
        high
    );

    high.connect(
        mid
    );

    mid.connect(
        low
    );

    low.connect(
        channelGain
    );

    channelGain.connect(
        panner
    );


    /* SOM DIRETO */

    panner.connect(
        analyser
    );


    /* DELAY */

    panner.connect(
        delay
    );

    delay.connect(
        delayFeedback
    );

    delayFeedback.connect(
        delay
    );

    delay.connect(
        delayMix
    );

    delayMix.connect(
        analyser
    );


    analyser.connect(
        masterHigh
    );


    canal.source =
        source;

    canal.preampGain =
        preamp;

    canal.highFilter =
        high;

    canal.midFilter =
        mid;

    canal.lowFilter =
        low;

    canal.channelGain =
        channelGain;

    canal.panner =
        panner;

    canal.analyser =
        analyser;

    canal.delay =
        delay;

    canal.delayFeedback =
        delayFeedback;

    canal.delayMix =
        delayMix;


    aplicarControlesCanal(
        canal
    );


    iniciarMeter(
        canal
    );


    source.onended =
        function() {

            if (
                canal.pausando
            ) {
                return;
            }


            if (
                canal.playing
            ) {

                canal.playing =
                    false;

                canal.offset =
                    0;

                atualizarBotaoPlay(
                    canal
                );

            }

        };
}


/* =====================================================
   PLAY / PAUSE
===================================================== */

async function alternarPlay(canal) {

    /* YOUTUBE */

    if (
        canal.ytPlayer
    ) {

        try {

            const estado =
                canal.ytPlayer
                    .getPlayerState();


            if (
                estado ===
                YT.PlayerState.PLAYING
            ) {

                canal.ytPlayer.pauseVideo();

            } else {

                canal.ytPlayer.playVideo();

            }

        } catch(e) {

            console.error(e);

        }

        return;
    }


    /* LOCAL */

    if (
        !canal.audioBuffer
    ) {

        alert(
            "Escolha um áudio ou carregue um YouTube."
        );

        return;
    }


    await iniciarAudio();


    if (
        !canal.playing
    ) {

        if (
            canal.offset >=
            canal.audioBuffer.duration
        ) {

            canal.offset =
                0;
        }


        iniciarCanalNaPosicao(
            canal,
            canal.offset
        );

    } else {

        pausarCanal(
            canal
        );

    }
}


/* =====================================================
   INICIAR CANAL
===================================================== */

function iniciarCanalNaPosicao(
    canal,
    posicao
) {

    if (
        !canal.audioBuffer
    ) {
        return;
    }


    criarAudioCanal(
        canal
    );


    canal.offset =
        Math.max(
            0,
            Math.min(
                posicao,
                canal.audioBuffer.duration
            )
        );


    canal.startTime =
        audioContext.currentTime -
        canal.offset;


    canal.source.start(
        0,
        canal.offset
    );


    canal.playing =
        true;


    atualizarBotaoPlay(
        canal
    );
}


/* =====================================================
   PAUSAR
===================================================== */

function pausarCanal(canal) {

    if (
        !canal.playing
    ) {
        return;
    }


    const decorrido =
        audioContext.currentTime -
        canal.startTime;


    canal.offset +=
        decorrido;


    canal.offset =
        Math.max(
            0,
            Math.min(
                canal.offset,
                canal.audioBuffer.duration
            )
        );


    canal.pausando =
        true;


    try {

        canal.source.onended =
            null;

        canal.source.stop();

    } catch(e) {}


    canal.source =
        null;

    canal.playing =
        false;

    canal.pausando =
        false;


    atualizarBotaoPlay(
        canal
    );
}


/* =====================================================
   REINICIAR
===================================================== */

function reiniciarCanalNaPosicao(
    canal,
    posicao
) {

    if (
        !canal.audioBuffer ||
        !canal.playing
    ) {
        return;
    }


    canal.offset =
        Math.max(
            0,
            Math.min(
                posicao,
                canal.audioBuffer.duration
            )
        );


    try {

        canal.source.onended =
            null;

        canal.source.stop();

    } catch(e) {}


    criarAudioCanal(
        canal
    );


    canal.startTime =
        audioContext.currentTime -
        canal.offset;


    canal.source.start(
        0,
        canal.offset
    );


    canal.playing =
        true;


    atualizarBotaoPlay(
        canal
    );
}


/* =====================================================
   BOTÃO PLAY
===================================================== */

function atualizarBotaoPlay(canal) {

    const botao =

    if (
        canal.playing
    ) {

        botao.textContent =

    } else {

        botao.textContent =

        );

    }
}

function atualizarVolumeCanal(canal) {

    if (
        !canal.channelGain
    ) {

    }


    const fader =
        Number(
            canal.querySelector(

            ).value
        );


    const mute =
        canal.querySelector(
            ".mute"
        ).classList.contains(
            "ativo"
        );


    const existeSolo =
        canais.some(
            c =>
                c.querySelector(
                    ".solo"
                ).classList.contains(
                    "ativo"
                )
        );


    const esteSolo =
        canal.querySelector(
            ".solo"
        ).classList.contains(
            "ativo"
        );


    if (mute) {

        canal.channelGain.gain.value =
            0;

    }

    else if (
        existeSolo &&
        !esteSolo
    ) {

        canal.channelGain.gain.value =
            0;

    }

    else {

        canal.channelGain.gain.value =
            fader / 100;

    }
}


/* =====================================================
   PREAMP
===================================================== */

function aplicarPreamp(
    canal,
    valor
) {

    if (
        !canal.preampGain
    ) {
        return;
    }


    canal.preampGain.gain.value =
        Math.pow(
            10,
            valor / 20
        );
}


/* =====================================================
   CONTROLES
===================================================== */

function aplicarControlesCanal(
    canal
) {

    canal.querySelectorAll(
        ".knob"
    ).forEach(
        knob => {

            const tipo =
                knob.dataset.tipo;


            const valor =
                Number(
                    knob.dataset.valor
                );


            if (
                tipo === "gain"
            ) {

                aplicarPreamp(
                    canal,
                    valor
                );

            }


            if (
                tipo === "high" &&
                canal.highFilter
            ) {

                canal.highFilter.gain.value =
                    valor;

            }


            if (
                tipo === "mid" &&
                canal.midFilter
            ) {

                canal.midFilter.gain.value =
                    valor;

            }


            if (
                tipo === "low" &&
                canal.lowFilter
            ) {

                canal.lowFilter.gain.value =
                    valor;

            }

        }
    );


    const pan =
        canal.querySelector(

        );


    if (
        canal.panner
    ) {

        canal.panner.pan.value =
            Number(

/* =====================================================
   KNOBS
===================================================== */

function configurarKnob(knob) {

    let valor =
        Number(
            knob.dataset.valor
        );


    let inicioY =
        0;

    let inicioValor =
        0;


    function atualizar() {

        valor =
            Math.max(
                -12,
                Math.min(
                    12,
                    valor
                )
            );


        knob.dataset.valor =
            valor;


        atualizarVisualKnob(
            knob
        );


        const canal =
            knob.closest(
                ".canal"
            );


        if (
            canal &&
            canal.classList.contains(
                "master"
            )
        ) {

            aplicarMasterKnob(
                knob,
                valor
            );

        }

        else if (
            canal
        ) {

            aplicarControlesCanal(
                canal
            );

        }


        salvarAutomaticamente();
    }


    knob.addEventListener(
        "mousedown",
        function(e) {

            inicioY =
                e.clientY;

            inicioValor =
                valor;


            function mover(ev) {

                const diferenca =
                    inicioY -
                    ev.clientY;


                valor =
                    inicioValor +
                    Math.round(
                        diferenca / 5
                    );


                atualizar();
            }


            function soltar() {

                document.removeEventListener(
                    "mousemove",
                    mover
                );

                document.removeEventListener(
                    "mouseup",
                    soltar
                );
            }


            document.addEventListener(
                "mousemove",
                mover
            );

            document.addEventListener(
                "mouseup",
                soltar
            );

        }
    );


    atualizarVisualKnob(
        knob
    );
}


/* =====================================================
   VISUAL KNOB
===================================================== */

function atualizarVisualKnob(
    knob
) {

    const valor =
        Number(
            knob.dataset.valor
        );


    const graus =
        -135 +
        (
            (valor + 12) /
            24
        ) * 270;


    knob.style.transform =
        "rotate(" +
        graus +
        "deg)";


    const texto =
        knob.parentElement.querySelector(
            ".valor-knob"
        );


    if (
        texto
    ) {

        texto.textContent =
            valor > 0
            ? "+" + valor + " dB"
            : valor + " dB";

    }
}

/* =====================================================
   METER
===================================================== */

function iniciarMeter(canal) {

    if (
        !canal.analyser
    ) {
        return;
    }


    const meter =
        canal.querySelector(
            ".meter"
        );


    if (
        !meter
    ) {
        return;
    }


    const leds =
        meter.querySelectorAll(
            ".led"
        );


    const dados =
        new Uint8Array(
            canal.analyser.fftSize
        );


    function atualizar() {

        if (
            !canal.analyser
        ) {
            return;
        }


        canal.analyser
            .getByteTimeDomainData(
                dados
            );


        let soma =
            0;


        for (
            let i = 0;
            i < dados.length;
            i++
        ) {

            const v =
                (
                    dados[i] -
                    128
                ) / 128;


            soma +=
                v * v;

        }


        const rms =
            Math.sqrt(
                soma /
                dados.length
            );


        const nivel =
            Math.min(
                20,
                Math.floor(
                    rms * 55
                )
            );


        leds.forEach(
            (led, i) => {

                led.className =
                    "led";


                if (
                    i < nivel
                ) {

                    if (
                        i < 13
                    ) {

                        led.classList.add(
                            "verde"
                        );

                    }

                    else if (
                        i < 17
                    ) {

                        led.classList.add(
                            "amarelo"
                        );

                    }

                    else {

                        led.classList.add(
                            "vermelho"
                        );

                    }

                }

            }
        );


        requestAnimationFrame(
            atualizar
        );
    }


    atualizar();
}


/* =====================================================
   TEMPO
===================================================== */

function formatarTempo(
    segundos
) {

    if (
        !isFinite(
            segundos
        ) ||
        segundos < 0
    ) {

        return "00:00";
    }


    segundos =
        Math.floor(
            segundos
        );


    const minutos =
        Math.floor(
            segundos / 60
        );


    const segundosRestantes =
        segundos % 60;


    return String(
        minutos
    ).padStart(
        2,
        "0"
    )
    +
    ":"
    +
    String(
        segundosRestantes
    ).padStart(
        2,
        "0"
    );
}


function atualizarTempoCanal(
    canal,
    posicao
) {

    const tempo =
        canal.querySelector(
            ".tempo-atual"
        );


    if (
        tempo
    ) {

        tempo.textContent =
            formatarTempo(
                posicao
            );

    }
}


/* =====================================================
   RELÓGIO
===================================================== */

function atualizarRelogio() {

    canais.forEach(
        canal => {

            if (
                canal.ytPlayer &&
                canal.playing
            ) {

                try {

                    const atual =
                        canal.ytPlayer
                            .getCurrentTime();


                    canal.offset =
                        atual;


                    const seek =
                        canal.querySelector(
                            ".seek"
                        );


                    seek.value =
                        atual;


                    atualizarTempoCanal(
                        canal,
                        atual
                    );

                } catch(e) {}

            }


            else if (
                canal.audioBuffer &&
                canal.playing &&
                audioContext
            ) {

                const posicao =
                    audioContext.currentTime -
                    canal.startTime;


                canal.offset =
                    posicao;


                const seek =
                    canal.querySelector(
                        ".seek"
                    );


                seek.value =
                    posicao;


                atualizarTempoCanal(
                    canal,
                    posicao
                );

            }

        }
    );


    requestAnimationFrame(
        atualizarRelogio
    );
}


atualizarRelogio();

===================================================== */

async function playTodos() {

    await iniciarAudio();


    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.playVideo();

                } catch(e) {}

                return;
            }


            if (
                canal.audioBuffer &&
                !canal.playing
            ) {

                iniciarCanalNaPosicao(
                    canal,
                    canal.offset || 0
                );

            }

        }
    );


    salvarAutomaticamente();
}

   PAUSAR TODOS
===================================================== */

function pausarTodos() {

    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.pauseVideo();

                } catch(e) {}

            }


            if (
                canal.audioBuffer &&
                canal.playing
            ) {

                pausarCanal(
                    canal
                );

            }

        }
    );


    salvarAutomaticamente();
}


/* =====================================================
   PARAR TODOS
===================================================== */

function pararTodos() {

    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.stopVideo();

                } catch(e) {}

            }


            if (
                canal.source
            ) {

                try {

                    canal.source.stop();

                } catch(e) {}

            }


            canal.source =
                null;

            canal.playing =
                false;

            canal.offset =
                0;


            const seek =
                canal.querySelector(
                    ".seek"
                );


            if (
                seek
            ) {

                seek.value =
                    0;

            }


            atualizarTempoCanal(
                canal,
                0
            );


            atualizarBotaoPlay(
                canal
            );

        }
    );


    salvarAutomaticamente();
}


/* =====================================================
   SINCRONIZAR TODOS
===================================================== */

function sincronizarTodos() {

    canais.forEach(
        canal => {

            canal.offset =
                0;


            const seek =
                canal.querySelector(
                    ".seek"
                );


            if (
                seek
            ) {

                seek.value =
                    0;

            }


            atualizarTempoCanal(
                canal,
                0
            );


            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.seekTo(
                        0,
                        true
                    );

                } catch(e) {}

            }

        }
    );


    salvarAutomaticamente();


    alert(
        "Todos os canais foram sincronizados no início."
    );
}

/* =====================================================
   APLICAÇÃO DE EFEITOS
===================================================== */

function aplicarEfeitos(
    canal
) {

    /*
       Os efeitos avançados são aplicados
       somente quando existe cadeia Web Audio.
    */

    if (
        !audioContext ||
        !canal.channelGain
    ) {
        return;
    }


    /* COMPRESSOR */

    if (
        canal.effects.compressor
    ) {

        if (
            !canal.effectNodes.compressor
        ) {

            const compressor =
                audioContext.createDynamicsCompressor();


            compressor.threshold.value =
                -24;

            compressor.knee.value =
                30;

            compressor.ratio.value =
                4;

            compressor.attack.value =
                0.003;

            compressor.release.value =
                0.25;


            canal.effectNodes.compressor =
                compressor;

        }

    }


    /*
       O delay já existe na cadeia principal.
       Aqui apenas habilitamos/desabilitamos o mix.
    */

    if (
        canal.delayMix
    ) {

        const mix =
            Number(
                canal.querySelector(
                    ".delay-mix"
                ).value
            ) / 100;


        canal.delayMix.gain.value =
            canal.effects.delay
            ? mix
            : 0;

    }
}

        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    cenas[nome] =
        obterEstado();


    localStorage.setItem(
        "mesaSomCenas",
        JSON.stringify(
            cenas
        )
    );


    document.getElementById(
        "nomeCena"
    ).value =
        "";


    atualizarListaCenas();


    alert(
        "Cena salva com sucesso!"
    );
}


/* =====================================================
   LISTA DE CENAS
===================================================== */

function atualizarListaCenas() {

    const lista =
        document.getElementById(
            "listaCenas"
        );


    lista.innerHTML =
        "";


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    const nomes =
        Object.keys(
            cenas
        );


    if (
        nomes.length === 0
    ) {

        lista.innerHTML = `
            <div style="
                color:#666;
                text-align:center;
                padding:15px;
                font-size:9px;
            ">
                Nenhuma cena salva.
            </div>
        `;

        return;
    }


    nomes.forEach(
        nome => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-cena";


            item.innerHTML = `

                <span>
                    ${escaparHTML(nome)}
                </span>

                <span>

                    <button>
                        CARREGAR
                    </button>

                    <button>
                        EXCLUIR
                    </button>

                </span>
            `;


            const botoes =
                item.querySelectorAll(
                    "button"
                );


            botoes[0].onclick =
                function() {

                    carregarCena(
                        nome
                    );

                };


            botoes[1].onclick =
                function() {

                    excluirCena(
                        nome
                    );

                };


            lista.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   CARREGAR CENA
===================================================== */

function carregarCena(
    nome
) {

    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    const estado =
        cenas[nome];


    if (
        !estado
    ) {
        return;
    }


    aplicarEstado(
        estado
    );


    alert(
        "Cena '" +
        nome +
        "' carregada."
    );
}


/* =====================================================
   EXCLUIR CENA
===================================================== */

function excluirCena(
    nome
) {

    if (
        !confirm(
            "Excluir a cena '" +
            nome +
            "'?"
        )
    ) {
        return;
    }


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    delete cenas[nome];


    localStorage.setItem(
        "mesaSomCenas",
        JSON.stringify(
            cenas
        )
    );


    atualizarListaCenas();
}


/* =====================================================
   APLICAR ESTADO
===================================================== */

function aplicarEstado(
    estado
) {

    /* MASTER */

    if (
        estado.masterFader !==
        undefined
    ) {

        const fader =
            document.getElementById(
                "masterFader"
            );


        fader.value =
            estado.masterFader;


        document.getElementById(
            "masterValor"
        ).textContent =
            estado.masterFader +
            "%";

    }


    const masterMute =
        document.getElementById(
            "masterMute"
        );


    masterMute.classList.toggle(
        "ativo",
        !!estado.masterMute
    );


    /* MASTER EQ */

    if (
        Array.isArray(
            estado.masterEQ
        )
    ) {

        const knobs =
            document.querySelectorAll(
                ".master .knob"
            );


        estado.masterEQ.forEach(
            (valor, i) => {

                if (
                    knobs[i]
                ) {

                    knobs[i].dataset.valor =
                        valor;

                    atualizarVisualKnob(
                        knobs[i]
                    );

                    aplicarMasterKnob(
                        knobs[i],
                        valor
                    );

                }

            }
        );

    }


    /* CANAIS */

    if (
        Array.isArray(
            estado.canais
        )
    ) {

        while (
            canais.length <
            estado.canais.length
        ) {

            adicionarCanal();

        }


        estado.canais.forEach(
            (dados, i) => {

                const canal =
                    canais[i];


                if (
                    !canal
                ) {
                    return;
                }


                canal.querySelector(
                    ".nome"
                ).value =
                    dados.nome || "";


                canal.querySelector(
                    ".fader"
                ).value =
                    dados.fader ??
                    75;


                canal.querySelector(
                    ".valor-fader"
                ).textContent =
                    (
                        dados.fader ??
                        75
                    ) +
                    "%";


                canal.querySelector(
                    ".pan"
                ).value =
                    dados.pan ??
                    0;


                canal.querySelector(
                    ".aux"
                ).value =
                    dados.aux ??
                    0;


                canal.querySelector(
                    ".mute"
                ).classList.toggle(
                    "ativo",
                    !!dados.mute
                );


                canal.classList.toggle(
                    "mutado",
                    !!dados.mute
                );


                canal.querySelector(
                    ".solo"
                ).classList.toggle(
                    "ativo",
                    !!dados.solo
                );


                canal.classList.toggle(
                    "solo-canal",
                    !!dados.solo
                );


                if (
                    Array.isArray(
                        dados.knobs
                    )
                ) {

                    const knobs =
                        canal.querySelectorAll(
                            ".knob"
                        );


                    dados.knobs.forEach(
                        (valor, k) => {

                            if (
                                knobs[k]
                            ) {

                                knobs[k].dataset.valor =
                                    valor;

                                atualizarVisualKnob(
                                    knobs[k]
                                );

                            }

                        }
                    );

                }


                if (
                    dados.delayTime !==
                    undefined
                ) {

                    canal.querySelector(
                        ".delay-time"
                    ).value =
                        dados.delayTime;

                    canal.querySelector(
                        ".delay-time-value"
                    ).textContent =
                        dados.delayTime +
                        " ms";

                }


                if (
                    dados.delayMix !==
                    undefined
                ) {

                    canal.querySelector(
                        ".delay-mix"
                    ).value =
                        dados.delayMix;

                    canal.querySelector(
                        ".delay-mix-value"
                    ).textContent =
                        dados.delayMix +
                        "%";

                }


                if (
                    dados.delayFeedback !==
                    undefined
                ) {

                    canal.querySelector(
                        ".delay-feedback"
                    ).value =
                        dados.delayFeedback;

                    canal.querySelector(
                        ".delay-feedback-value"
                    ).textContent =
                        dados.delayFeedback +
                        "%";

                }


                if (
                    dados.youtubeUrl
                ) {

                    canal.querySelector(
                        ".youtube-url"
                    ).value =
                        dados.youtubeUrl;

                }


                canal.offset =
                    dados.offset ||
                    0;


                if (
                    dados.effects
                ) {

                    canal.effects =
                        {
                            gate:
                                !!dados.effects.gate,

                            compressor:
                                !!dados.effects.compressor,

                            reverb:
                                !!dados.effects.reverb,

                            delay:
                                !!dados.effects.delay
                        };

                }


                if (
                    canal.audioBuffer
                ) {

                    criarAudioCanal(
                        canal
                    );

                }

            }
        );

    }


    atualizarSolos();

    aplicarVolumeMaster();

    salvarAutomaticamente();
}


/* =====================================================
   COMPARTILHAR MESA
===================================================== */

async function compartilharMesa() {

    const estado =
        obterEstado();


    const texto =
        JSON.stringify(
            estado
        );


    const dados =
        btoa(
            unescape(
                encodeURIComponent(
                    texto
                )
            )
        );


    const url =
        window.location.href.split(
            "#"
        )[0]
        +
        "#mesa="
        +
        dados;


    try {

        await navigator.clipboard.writeText(
            url
        );


        alert(
            "Link da mesa copiado para a área de transferência."
        );

    } catch(e) {

        prompt(
            "Copie o link abaixo:",
            url
        );

    }
}


/* =====================================================
   RESTAURAR MESA COMPARTILHADA
===================================================== */

function carregarMesaDoHash() {

    if (
        !window.location.hash.startsWith(
            "#mesa="
        )
    ) {
        return false;
    }


    try {

        const dados =
            window.location.hash.substring(
                6
            );


        const texto =
            decodeURIComponent(
                escape(
                    atob(
                        dados
                    )
                )
            );


        const estado =
            JSON.parse(
                texto
            );


        aplicarEstado(
            estado
        );


        return true;

    } catch(e) {

        console.error(
            "Erro ao abrir mesa compartilhada:",
            e
        );

        return false;
    }
}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
) {

    return String(
        texto
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* =====================================================
   CRIAR 10 CANAIS
===================================================== */

for (
    let i = 0;
    i < 10;
    i++
) {

    const mesa =
        document.getElementById(
            "mesa"
        );


    const botao =
        document.getElementById(
            "botaoAdicionar"
        );


    mesa.insertBefore(
        criarCanal(),
        botao
    );
}


/* =====================================================
   MASTER KNOBS
===================================================== */

document.querySelectorAll(
    ".master .knob"
).forEach(
    configurarKnob
);


/* =====================================================
   RESTAURAR SALVAMENTO AUTOMÁTICO
===================================================== */

try {

    const salvo =
        localStorage.getItem(
            "mesaSomAuto"
        );


    if (
        salvo
    ) {

        const estado =
            JSON.parse(
                salvo
            );


        /*
           Restauramos os controles depois
           que os canais já foram criados.
        */

        aplicarEstado(
            estado
        );

    }

} catch(e) {

    console.warn(
        "Não foi possível restaurar a mesa.",
        e
    );
}


/* =====================================================
   MESA COMPARTILHADA
===================================================== */

if (
    !carregarMesaDoHash()
) {

    atualizarContador();

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

atualizarContador();

console.log(
    "MIXER PRO iniciado corretamente."
);

</script>
