<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: auto;
}

header {
    min-height: 65px;
    background: linear-gradient(#292929, #111);
    border-bottom: 2px solid #000;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
}

.logo {
    color: #00ff88;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-right: 10px;
}

.top-btn {
    background: #222;
    border: 1px solid #555;
    color: #ddd;
    padding: 9px 12px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    font-weight: bold;
}

.top-btn:hover {
    background: #333;
}

.top-btn.green {
    color: #00ff88;
    border-color: #00ff88;
}

.top-btn.red {
    color: #ff5555;
    border-color: #aa3333;
}

.top-btn.blue {
    color: #55aaff;
    border-color: #336699;
}

.status {
    margin-left: auto;
    color: #777;
    font-size: 10px;
}

.status span {
    color: #00ff88;
}

.mesa-area {
    padding: 15px;
}

.mesa {
    display: flex;
    gap: 7px;
    align-items: stretch;
    min-width: max-content;
}

.canal {
    width: 155px;
    min-height: 930px;
    background: linear-gradient(
        90deg,
        #111,
        #292929,
        #111
    );
    border: 1px solid #444;
    border-radius: 6px;
    padding: 8px;
    box-shadow:
        inset 0 0 15px #000,
        0 5px 15px #000;
    position: relative;
}

.canal.mutado {
    opacity: .45;
}

.canal.solo-canal {
    border-color: #ffd400;
    box-shadow:
        0 0 10px #ffd400,
        inset 0 0 15px #000;
}

.cabecalho-canal {
    background: #0b0b0b;
    border-bottom: 2px solid #00ff88;
    border-radius: 4px;
    padding: 5px;
    text-align: center;
    margin-bottom: 7px;
}

.cabecalho-canal strong {
    color: #00ff88;
    font-size: 12px;
}

.cabecalho-canal small {
    display: block;
    color: #777;
    font-size: 8px;
    margin-top: 3px;
}

.nome {
    width: 100%;
    margin-top: 5px;
    padding: 5px;
    background: #111;
    color: #00ff88;
    border: 1px solid #444;
    border-radius: 4px;
    text-align: center;
    outline: none;
    font-size: 10px;
}

.nome:focus {
    border-color: #00ff88;
}

.secao {
    border-bottom: 1px solid #3b3b3b;
    padding: 8px 0;
}

.titulo {
    color: #777;
    text-align: center;
    font-size: 8px;
    letter-spacing: 1px;
    margin-bottom: 7px;
}

.knobs {
    display: flex;
    justify-content: space-around;
}

.knob-box {
    width: 42px;
    text-align: center;
}

.knob {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    position: relative;
    cursor: ns-resize;
    touch-action: none;
    user-select: none;
    background:
        radial-gradient(
            circle at 32% 28%,
            #999,
            #555 32%,
            #181818 70%
        );
    border: 2px solid #080808;
    box-shadow:
        0 3px 5px #000,
        inset 0 1px 3px #aaa;
}

.knob::after {
    content: "";
    position: absolute;
    width: 3px;
    height: 11px;
    background: #00ff88;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 2px;
    box-shadow: 0 0 6px #00ff88;
}

.knob-box label {
    display: block;
    color: #aaa;
    font-size: 7px;
    margin-top: 3px;
}

.knob-box .valor-knob {
    color: #00ff88;
    font-size: 7px;
}

.botoes {
    display: flex;
    gap: 4px;
}

.btn {
    flex: 1;
    background: #222;
    color: #aaa;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 7px 2px;
    cursor: pointer;
    font-size: 8px;
    font-weight: bold;
}

.btn:hover {
    background: #333;
}

.btn.play {
    color: #00ff88;
}

.btn.play.ativo {
    background: #00aa55;
    color: white;
}

.btn.mute.ativo {
    background: #e00000;
    color: white;
}

.btn.solo.ativo {
    background: #ffd400;
    color: black;
}
.btn.efeito-ativo {

    color: white;

}
.btn.copy {
    color: #55aaff;
}

.btn.paste {
    color: #ffbb55;
}

.audio-file {
    width: 100%;
    color: #aaa;
    font-size: 7px;
}

.audio-file::file-selector-button {
    background: #222;
    color: #ddd;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 4px;
}

.slider {
    width: 100%;
    accent-color: #00ff88;
    cursor: pointer;
}

/* =========================
   PLAYER / AGULHA
========================= */

.player-tempo {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 7px;
    margin-bottom: 4px;
}

.player-tempo .tempo-atual {
    color: #00ff88;
}

.seek {
    width: 100%;
    height: 5px;
    accent-color: #00ff88;
    cursor: pointer;
    margin: 0;
}

.seek::-webkit-slider-thumb {
    cursor: grab;
}

.seek::-webkit-slider-runnable-track {
    height: 5px;
}

/* =========================
   FADER
========================= */

.fader-area {

    justify-content: center;
    align-items: center;
}

.fader {

    transform: rotate(-90deg);

}

.valor-fader {

    text-align: center;
    color: #00ff88;

/* =========================
   METER
========================= */

.meter-area {

.meter {

.led.amarelo {

.led.vermelho {

.remove {

.add-canal:hover {

}

.add-icon {

.master {

}

.master .cabecalho-canal {

.master .cabecalho-canal strong {

/* =========================

========================= */

.controle-todos {

.controle-todos button {

.controle-todos .play-todos {

.controle-todos .pause-todos {

.controle-todos .stop-todos {

.controle-todos .sync-todos {

.info-arquivo {

.youtube-player {

/* =========================

.modal {

.modal.aberto {

.caixa-modal {

.caixa-modal h2 {

.input-cena {

</style>
</head>

<body>

<script>

/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

let youtubeAPIPronta = false;

function onYouTubeIframeAPIReady() {

    youtubeAPIPronta = true;

    console.log(
        "YouTube API pronta!"
    );

}

let masterGain = null;
let masterHigh = null;
let masterMid = null;
let masterLow = null;

let canais = [];
let numeroCanal = 0;

let canalCopiado = null;


/* =====================================================
   INICIAR AUDIO
===================================================== */

async function iniciarAudio() {

    if (!audioContext) {

        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();

        masterHigh =
            audioContext.createBiquadFilter();

        masterHigh.type = "highshelf";
        masterHigh.frequency.value = 6000;

        masterMid =
            audioContext.createBiquadFilter();

        masterMid.type = "peaking";
        masterMid.frequency.value = 1000;
        masterMid.Q.value = 1;

        masterLow =
            audioContext.createBiquadFilter();

        masterLow.type = "lowshelf";
        masterLow.frequency.value = 120;

        masterGain =
            audioContext.createGain();

        masterHigh.connect(masterMid);
        masterMid.connect(masterLow);
        masterLow.connect(masterGain);
        masterGain.connect(audioContext.destination);

        aplicarVolumeMaster();

    }

    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }

    document.getElementById(
        "statusAudio"
    ).textContent = "ATIVO";
}


/* =====================================================
   METER
===================================================== */

function criarMeter() {

    const meter =
        document.createElement("div");

    meter.className = "meter";

    for (let i = 0; i < 20; i++) {

        const led =
            document.createElement("div");

        led.className = "led";

        meter.appendChild(led);
    }

    return meter;
}


/* =====================================================
   CRIAR CANAL
===================================================== */

    canal.innerHTML = `

    <div class="titulo">

    >

    <button

    >
        ▶ CARREGAR YOUTUBE
    </button>

    <div class="youtube-player"></div>

    <div class="info-arquivo">
        Nenhum áudio selecionado
    </div>

</div>

        <div class="cabecalho-canal">

            <strong>
                CH ${numero}
            </strong>

            <small>
                INPUT ${numero}
            </small>

            <input
                class="nome"
                value="Canal ${numero}"
            >

        </div>


        <div class="secao">

    <div class="titulo">
        DELAY
    </div>

    <label style="font-size:7px;color:#aaa;">
        TEMPO
    </label>

    <input
        class="slider delay-time"
        type="range"
        min="0"
        max="1000"
        value="300"
    >

    <div
        class="delay-time-value"
        style="text-align:center;color:#00ff88;font-size:7px;">
        300 ms
    </div>


    <label style="font-size:7px;color:#aaa;">

    </label>

    <input

        type="range"
        min="0"
        max="100"
        value="0"
    >

   <div

</div>


    <label style="font-size:7px;color:#aaa;">

    <input

</div>


<!-- BOTÃO DE EFEITOS -->

<div class="secao">

</div>


      <div class="secao">

</div>


        <!-- AGULHA -->

/* =====================================================

===================================================== */

function compartilharMesa() {

    try {

        const estado =
            obterEstado();

        const dados =
            encodeURIComponent(
                JSON.stringify(estado)
            );

        const link =
            window.location.origin +
            window.location.pathname +
            "#mesa=" +
            dados;

        if (
            navigator.clipboard &&
            navigator.clipboard.writeText
        ) {

            navigator.clipboard.writeText(
                link
            ).then(
                function() {

                    alert(
                        "Link da mesa copiado!\n\nAgora você pode enviar esse link pelo WhatsApp, Telegram ou onde quiser."
                    );

                }
            );

        } else {

            prompt(
                "Copie este link:",
                link
            );

        }

    } catch(e) {

        console.error(e);

        alert(
            "Não foi possível criar o link de compartilhamento."
        );

    }

}


/* =====================================================
   ABRIR MESA COMPARTILHADA
===================================================== */

function carregarMesaCompartilhada() {

    if (
        !window.location.hash.startsWith(
            "#mesa="
        )
    ) {

        return false;

    }

    try {

        const dados =
            window.location.hash.substring(
                6
            );

        const estado =
            JSON.parse(
                decodeURIComponent(
                    dados
                )
            );

        aplicarEstado(
            estado
        );

        alert(
            "Mesa compartilhada carregada!"
        );

        return true;

    } catch(e) {

        console.error(e);

        alert(
            "Não foi possível abrir a mesa compartilhada."
        );

        return false;

    }

}
/* =====================================================
   YOUTUBE
===================================================== */

function obterYoutubeId(url) {

    if (!url)
        return null;

    try {

        const endereco =
            new URL(url);

        if (
            endereco.hostname.includes(
                "youtube.com"
            )
        ) {

            return endereco.searchParams.get(
                "v"
            );
        }

        if (
            endereco.hostname.includes(
                "youtu.be"
            )
        ) {

            return endereco.pathname
                .substring(1);
        }

    } catch(e) {

        return null;

    }

    return null;
}


function carregarYouTube(canal) {

    const campo = canal.querySelector(".youtube-url");

    const url = campo.value.trim();

    if (!url) {
        alert("Cole primeiro um link do YouTube.");
        return;
    }

    const id = obterYoutubeId(url);

    if (!id) {
        alert("Esse link não parece ser um link válido do YouTube.");
        return;
    }

    canal.youtubeUrl = url;
    canal.youtubeId = id;

    canal.audioBuffer = null;

    if (canal.source) {
        try {
            canal.source.stop();
        } catch(e) {}

        canal.source = null;
    }

    const playerDiv =
        canal.querySelector(".youtube-player");

    playerDiv.innerHTML = "";

    playerDiv.style.display = "block";

    const playerElement =
        document.createElement("div");

    playerDiv.appendChild(playerElement);

    canal.ytPlayer =
        new YT.Player(playerElement, {

            width: "1",
            height: "1",

            videoId: id,

            playerVars: {
                autoplay: 0,
                controls: 0,
                modestbranding: 1,
                rel: 0
            },

            events: {

                onReady: function() {

                    atualizarYouTubeCanal(canal);

                    const duracao =
                        canal.ytPlayer.getDuration();

                    const seek =
                        canal.querySelector(".seek");

                    seek.max = duracao;
                    seek.value = 0;

                    canal.querySelector(
                        ".tempo-total"
                    ).textContent =
                        formatarTempo(duracao);

                },

                onStateChange: function(event) {

                    if (
                        event.data ===
                        YT.PlayerState.PLAYING
                    ) {

                        canal.playing = true;

                        atualizarBotaoPlay(canal);

                    }

                    else if (
                        event.data ===
                        YT.PlayerState.PAUSED
                    ) {

                        canal.playing = false;

                        atualizarBotaoPlay(canal);

                    }

                    else if (
                        event.data ===
                        YT.PlayerState.ENDED
                    ) {

                        canal.playing = false;

                        canal.offset = 0;

                        atualizarBotaoPlay(canal);

                    }

                }

            }

        });

    canal.querySelector(
        ".info-arquivo"
    ).textContent =
        "YouTube carregado";

    salvarAutomaticamente();
}

async function carregarArquivo(
    arquivo,
    canal
) {

    if (!arquivo)
        return;

    await iniciarAudio();

    const dados =
        await arquivo.arrayBuffer();

    canal.audioBuffer =
        await audioContext.decodeAudioData(
            dados
        );

    canal.fileName =
        arquivo.name;

    canal.offset = 0;

    const seek =
        canal.querySelector(".seek");

    seek.max =
        canal.audioBuffer.duration;

    seek.value = 0;

    canal.querySelector(
        ".tempo-total"
    ).textContent =
        formatarTempo(
            canal.audioBuffer.duration
        );

    canal.querySelector(
        ".tempo-atual"
    ).textContent =
        "00:00";

    canal.querySelector(
        ".info-arquivo"
    ).textContent =
        arquivo.name;


    if (canal.source) {

        try {
            canal.source.stop();
        } catch(e) {}

    }

    canal.playing = false;

    atualizarBotaoPlay(canal);

    criarAudioCanal(canal);
}


/* =====================================================
   CRIAR CADEIA DE ÁUDIO
===================================================== */

function criarAudioCanal(canal) {

    if (!canal.audioBuffer)
        return;

    if (canal.source) {

        try {
            canal.source.stop();
        } catch(e) {}

    }


    const source =
        audioContext.createBufferSource();

    source.buffer =
        canal.audioBuffer;


    const preamp =
        audioContext.createGain();


    const channelGain =
        audioContext.createGain();


    const high =
        audioContext.createBiquadFilter();

    high.type = "highshelf";
    high.frequency.value = 6000;


    const mid =
        audioContext.createBiquadFilter();

    mid.type = "peaking";
    mid.frequency.value = 1000;
    mid.Q.value = 1;


    const low =
        audioContext.createBiquadFilter();

    low.type = "lowshelf";
    low.frequency.value = 120;


    const panner =
        audioContext.createStereoPanner();


    const analyser =
        audioContext.createAnalyser();

    analyser.fftSize = 256;

    const delay =
    audioContext.createDelay(2.0);

const delayFeedback =
    audioContext.createGain();

const delayMix =
    audioContext.createGain();

delay.delayTime.value = 0.3;

delayFeedback.gain.value = 0.2;

delayMix.gain.value = 0;

    source.connect(preamp);

preamp.connect(high);
high.connect(mid);
mid.connect(low);

low.connect(channelGain);

channelGain.connect(panner);

/* ÁUDIO DIRETO */
panner.connect(analyser);

/* DELAY */
panner.connect(delay);

delay.connect(delayFeedback);
delayFeedback.connect(delay);

delay.connect(delayMix);
delayMix.connect(analyser);

analyser.connect(masterHigh);


    canal.source = source;

    canal.preampGain = preamp;
    canal.highFilter = high;
    canal.midFilter = mid;
    canal.lowFilter = low;
    canal.channelGain = channelGain;
    canal.panner = panner;
    canal.analyser = analyser;

    canal.delay = delay;
    canal.delayFeedback = delayFeedback;
    canal.delayMix = delayMix;


    aplicarControlesCanal(canal);

    iniciarMeter(canal);


    source.onended = function() {

    if (canal.pausando) {
        return;
    }

    if (canal.playing) {

        canal.playing = false;

        canal.offset = 0;

        atualizarBotaoPlay(canal);

        atualizarSeekVisual(canal);
    }
};

}

/* =====================================================
   PLAY / PAUSE
===================================================== */

async function alternarPlay(canal) {

    /* =========================
       YOUTUBE
    ========================= */

    if (canal.ytPlayer) {

        const estado =
            canal.ytPlayer.getPlayerState();

        if (
            estado ===
            YT.PlayerState.PLAYING
        ) {

            canal.ytPlayer.pauseVideo();

        } else {

            canal.ytPlayer.playVideo();

        }

        return;
    }


    /* =========================
       ARQUIVO LOCAL
    ========================= */

    if (!canal.audioBuffer) {

        alert(
            "Primeiro escolha um arquivo de áudio ou carregue um link do YouTube."
        );

        return;
    }

    await iniciarAudio();


    if (!canal.playing) {

        if (
            canal.offset >=
            canal.audioBuffer.duration
        ) {

            canal.offset = 0;

        }

        iniciarCanalNaPosicao(
            canal,
            canal.offset
        );

    } else {

        pausarCanal(canal);

    }

    atualizarBotaoPlay(canal);
}

function atualizarYouTubeCanal(canal) {

    if (!canal.ytPlayer)
        return;

    try {

        const atual =
            canal.ytPlayer.getCurrentTime();

        const duracao =
            canal.ytPlayer.getDuration();

        canal.offset = atual;

        const seek =
            canal.querySelector(".seek");

        if (seek) {

            seek.max = duracao;
            seek.value = atual;

        }

        atualizarTempoCanal(
            canal,
            atual
        );

    } catch(e) {}

}


/* =====================================================
   INICIAR CANAL NA POSIÇÃO
===================================================== */

function iniciarCanalNaPosicao(
    canal,
    posicao
) {

    if (!canal.audioBuffer)
        return;


    criarAudioCanal(canal);


    canal.offset =
        Math.max(
            0,
            Math.min(
                posicao,
                canal.audioBuffer.duration
            )
        );


    canal.startTime =
    audioContext.currentTime -
    canal.offset;


    canal.source.start(
        0,
        canal.offset
    );


    canal.playing = true;


    atualizarBotaoPlay(canal);

    atualizarSeekVisual(canal);
}


/* =====================================================
   PAUSAR CANAL
===================================================== */

function pausarCanal(canal) {

    if (!canal.playing)
        return;


    const decorrido =
        audioContext.currentTime -
        canal.startTime;


    canal.offset += decorrido;


    canal.offset =
        Math.max(
            0,
            Math.min(
                canal.offset,
                canal.audioBuffer.duration
            )
        );


    /*
       Avisa ao onended que foi uma pausa
       e não o fim da música.
    */

    canal.pausando = true;


    try {

        canal.source.onended = null;

        canal.source.stop();

    } catch(e) {}


    canal.source = null;

    canal.playing = false;

    canal.pausando = false;


    atualizarSeekVisual(canal);

    atualizarBotaoPlay(canal);
}


/* =====================================================
   REINICIAR NA POSIÇÃO
===================================================== */

function reiniciarCanalNaPosicao(
    canal,
    posicao
) {

    if (!canal.audioBuffer)
        return;


    if (!canal.playing)
        return;


    canal.offset =
        Math.max(
            0,
            Math.min(
                posicao,
                canal.audioBuffer.duration
            )
        );


    try {

        canal.source.onended = null;

        canal.source.stop();

    } catch(e) {}


    criarAudioCanal(canal);


    canal.startTime =
        audioContext.currentTime;


    canal.source.start(
        0,
        canal.offset
    );


    canal.playing = true;


    atualizarSeekVisual(canal);
}

/* =====================================================
   BOTÃO PLAY
===================================================== */

function atualizarBotaoPlay(canal) {

    const botao =
        canal.querySelector(".play");

    if (canal.playing) {

        botao.textContent =
            "⏸ PAUSE";

        botao.classList.add(
            "ativo"
        );

    } else {

        botao.textContent =
            "▶ PLAY";

        botao.classList.remove(
            "ativo"
        );
    }
}


/* =====================================================
   PLAY TODOS
===================================================== */

async function playTodos() {

    const canaisComAudio =
        canais.filter(
            canal => canal.audioBuffer
        );

    if (
        canaisComAudio.length === 0
    ) {

        alert(
            "Nenhum canal possui arquivo de áudio."
        );

        return;
    }

    await iniciarAudio();


    const agora =
        audioContext.currentTime;


    canaisComAudio.forEach(
        canal => {

            if (canal.playing)
                return;

            let posicao =
                canal.offset || 0;

            if (
                posicao >=
                canal.audioBuffer.duration
            ) {
                posicao = 0;
            }

            criarAudioCanal(canal);

            canal.offset =
                posicao;

            canal.startTime =
                agora - posicao;

            canal.source.start(
                0,
                posicao
            );

            canal.playing = true;

            atualizarBotaoPlay(
                canal
            );
        }
    );
}


/* =====================================================
   PAUSAR TODOS
===================================================== */

function pausarTodos() {

    if (!audioContext)
        return;

    canais.forEach(
        canal => {

            if (canal.playing) {
                pausarCanal(canal);
            }

        }
    );

    salvarAutomaticamente();
}


/* =====================================================
   PARAR TODOS
===================================================== */

function pararTodos() {

    canais.forEach(
        canal => {

            if (canal.source) {

                try {
                    canal.source.stop();
                } catch(e) {}

            }

            canal.playing = false;
            canal.offset = 0;

            const seek =
                canal.querySelector(
                    ".seek"
                );

            if (seek) {
                seek.value = 0;
            }

            atualizarTempoCanal(
                canal,
                0
            );

            atualizarBotaoPlay(
                canal
            );

        }
    );

    salvarAutomaticamente();
}


/* =====================================================
   SINCRONIZAR TODOS
===================================================== */

function sincronizarTodos() {

    const canaisComAudio =
        canais.filter(
            canal => canal.audioBuffer
        );

    if (
        canaisComAudio.length === 0
    ) {

        alert(
            "Nenhum canal possui áudio."
        );

        return;
    }


    let menorDuracao =
        Infinity;

    canaisComAudio.forEach(
        canal => {

            menorDuracao =
                Math.min(
                    menorDuracao,
                    canal.audioBuffer.duration
                );

        }
    );


    let posicao = 0;

    canaisComAudio.forEach(
        canal => {

            if (
                canal.playing &&
                audioContext
            ) {

                posicao =
                    audioContext.currentTime -
                    canal.startTime;

            }

        }
    );


    posicao =
        Math.max(
            0,
            Math.min(
                posicao,
                menorDuracao
            )
        );


    canaisComAudio.forEach(
        canal => {

            if (canal.playing) {

                try {
                    canal.source.stop();
                } catch(e) {}

                canal.playing = false;
            }

            canal.offset =
                posicao;

            canal.querySelector(
                ".seek"
            ).value =
                posicao;

            atualizarTempoCanal(
                canal,
                posicao
            );

        }
    );


    salvarAutomaticamente();

    alert(
        "Todos os canais foram sincronizados em " +
        formatarTempo(posicao)
    );
}


/* =====================================================
   TEMPO
===================================================== */

function formatarTempo(segundos) {

    if (
        !isFinite(segundos) ||
        segundos < 0
    ) {
        return "00:00";
    }


    segundos =
        Math.floor(segundos);


    const minutos =
        Math.floor(
            segundos / 60
        );

    const segundosRestantes =
        segundos % 60;


    return String(minutos)
        .padStart(2, "0")
        +
        ":" +
        String(segundosRestantes)
            .padStart(2, "0");
}


/* =====================================================
   ATUALIZAR TEMPO
===================================================== */

function atualizarTempoCanal(
    canal,
    posicao
) {

    const tempo =
        canal.querySelector(
            ".tempo-atual"
        );

    if (tempo) {

        tempo.textContent =
            formatarTempo(posicao);
    }
}


/* =====================================================
   ATUALIZAR AGULHA
===================================================== */

function atualizarSeekVisual(canal) {

    if (!canal.audioBuffer)
        return;


    let posicao =
        canal.offset || 0;


    if (canal.playing) {

        posicao =
            audioContext.currentTime -
            canal.startTime;

    }


    if (
        posicao >
        canal.audioBuffer.duration
    ) {

        posicao =
            canal.audioBuffer.duration;
    }


    const seek =
        canal.querySelector(
            ".seek"
        );


    if (seek) {

        seek.value =
            posicao;
    }


    atualizarTempoCanal(
        canal,
        posicao
    );
}

===================================================== */

function atualizarVolumeCanal(canal) {

    if (!canal.channelGain)
        return;


    const fader =
        Number(
            canal.querySelector(
                ".fader"
            ).value
        );


    const mute =
        canal.querySelector(
            ".mute"
        ).classList.contains(
            "ativo"
        );


    const soloExiste =
        canais.some(
            c =>
                c.querySelector(
                    ".solo"
                ).classList.contains(
                    "ativo"
                )
        );


    const esteSolo =
        canal.querySelector(
            ".solo"
        ).classList.contains(
            "ativo"
        );


    if (mute) {

        canal.channelGain.gain.value =
            0;

    } else if (
        soloExiste &&
        !esteSolo
    ) {

        canal.channelGain.gain.value =
            0;

    } else {

        canal.channelGain.gain.value =
            fader / 100;

    }
}


/* =====================================================
   GAIN
===================================================== */

function aplicarPreamp(
    canal,
    valor
) {

    if (!canal.preampGain)
        return;

    canal.preampGain.gain.value =
        Math.pow(
            10,

===================================================== */

function aplicarControlesCanal(

    knobs.forEach(
        knob => {

            const tipo =

            const valor =

            if (tipo === "gain") {

                aplicarPreamp(
                    canal,

                );
            }


            if (

                canal.highFilter
            ) {

                canal.highFilter.gain.value =
                    valor;
            }


            if (
                tipo === "mid" &&
                canal.midFilter
            ) {

                canal.midFilter.gain.value =
                    valor;
            }


            if (
                tipo === "low" &&

/* =====================================================
   KNOBS
===================================================== */

function configurarKnob(knob) {

    let valor =
        Number(
            knob.dataset.valor
        );

    let inicioY = 0;
    let inicioValor = 0;


    function atualizar() {

        valor =
            Math.max(
                -12,
                Math.min(
                    12,
                    valor
                )
            );


        knob.dataset.valor =
            valor;


        atualizarVisualKnob(
            knob
        );


        const canal =
    knob.closest(".canal");

if (canal && canal.classList.contains("master")) {

    aplicarMasterKnob(
        knob,
        valor
    );

} else if (canal) {

    aplicarControlesCanal(
        canal
    );
}


        salvarAutomaticamente();
    }


    knob.addEventListener(
        "mousedown",
        function(e) {

            inicioY =
                e.clientY;

            inicioValor =
                valor;


            function mover(ev) {

                const diferenca =
                    inicioY -
                    ev.clientY;


                valor =
                    inicioValor +
                    Math.round(
                        diferenca / 5
                    );


                atualizar();
            }


            function soltar() {

                document.removeEventListener(
                    "mousemove",
                    mover
                );

                document.removeEventListener(
                    "mouseup",
                    soltar
                );
            }


            document.addEventListener(
                "mousemove",
                mover
            );

            document.addEventListener(
                "mouseup",
                soltar
            );

        }
    );


    knob.addEventListener(
        "touchstart",
        function(e) {

            inicioY =
                e.touches[0].clientY;

            inicioValor =
                valor;

        },
        { passive: true }
    );


    knob.addEventListener(
        "touchmove",
        function(e) {

            const diferenca =
                inicioY -
                e.touches[0].clientY;


            valor =
                inicioValor +
                Math.round(
                    diferenca / 5
                );


            atualizar();

        },
        { passive: true }
    );


    atualizarVisualKnob(
        knob
    );
}


/* =====================================================
   VISUAL KNOB
===================================================== */

function atualizarVisualKnob(
    knob
) {

    const valor =
        Number(
            knob.dataset.valor
        );


    const graus =
        -135 +
        (
            (valor + 12) / 24
        ) * 270;


    knob.style.transform =
        "rotate(" +
        graus +
        "deg)";


    const texto =
        knob.parentElement
            .querySelector(
                ".valor-knob"
            );


    if (texto) {

        texto.textContent =
            valor > 0
            ? "+" + valor + " dB"
            : valor + " dB";

    }
}

/* =====================================================
   METER
===================================================== */

function iniciarMeter(canal) {

    if (!canal.analyser)
        return;


    const meter =
        canal.querySelector(
            ".meter"
        );


    if (!meter)
        return;


    const leds =
        meter.querySelectorAll(
            ".led"
        );


    const dados =
        new Uint8Array(
            canal.analyser.fftSize
        );


    function atualizar() {

        if (!canal.analyser)
            return;


        canal.analyser
            .getByteTimeDomainData(
                dados
            );


        let soma = 0;


        for (
            let i = 0;
            i < dados.length;
            i++
        ) {

            const v =
                (dados[i] - 128) /
                128;

            soma +=
                v * v;
        }


        const rms =
            Math.sqrt(
                soma /
                dados.length
            );


        const nivel =
            Math.min(
                20,
                Math.floor(
                    rms * 55
                )
            );


        leds.forEach(
            (led, i) => {

                led.className =
                    "led";


                if (i < nivel) {

                    if (i < 13) {

                        led.classList.add(
                            "verde"
                        );

                    } else if (
                        i < 17
                    ) {

                        led.classList.add(
                            "amarelo"
                        );

                    } else {

                        led.classList.add(
                            "vermelho"
                        );
                    }
                }
            }
        );


        requestAnimationFrame(
            atualizar
        );
    }


    atualizar();
}

    );


    alert(
        "Cena salva!"
    );
}


/* =====================================================
   ABRIR CENAS
===================================================== */

function abrirCenas() {

    atualizarListaCenas();


    document.getElementById(
        "modalCenas"
    ).classList.add(
        "aberto"
    );
}


function fecharCenas() {

    document.getElementById(
        "modalCenas"
    ).classList.remove(
        "aberto"
    );
}


/* =====================================================
   LISTA DE CENAS
===================================================== */

function atualizarListaCenas() {

    const lista =
        document.getElementById(
            "listaCenas"
        );


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    lista.innerHTML = "";


    const nomes =
        Object.keys(cenas);


    if (
        nomes.length === 0
    ) {

        lista.innerHTML =
            "<p style='color:#777;text-align:center'>" +
            "Nenhuma cena salva." +
            "</p>";

        return;
    }


    nomes.forEach(
        nome => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-cena";


            const texto =
                document.createElement(
                    "span"
                );


            texto.textContent =
                nome;


            const botoes =
                document.createElement(
                    "span"
                );


            const carregar =
                document.createElement(
                    "button"
                );


            carregar.textContent =
                "CARREGAR";


            carregar.onclick =
                function() {

                    carregarCena(
                        nome
                    );

                };


            const excluir =
                document.createElement(
                    "button"
                );


            excluir.textContent =
                "🗑";


            excluir.onclick =
                function() {

                    excluirCena(
                        nome
                    );

                };


            botoes.appendChild(
                carregar
            );

            botoes.appendChild(
                excluir
            );


            item.appendChild(
                texto
            );

            item.appendChild(
                botoes
            );


            lista.appendChild(
                item
            );

        }
    );
}


/* =====================================================
   CARREGAR CENA
===================================================== */

function carregarCena(nome) {

    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    if (!cenas[nome])
        return;


    aplicarEstado(
        cenas[nome]
    );


    salvarAutomaticamente();

    fecharCenas();


    alert(
        "Cena carregada:\n" +
        nome +
        "\n\n" +
        "Se os arquivos de áudio não estiverem carregados, " +
        "selecione novamente os arquivos nos respectivos canais."
    );
}


/* =====================================================
   EXCLUIR CENA
===================================================== */

function excluirCena(nome) {

    if (
        !confirm(
            "Excluir a cena '" +
            nome +
            "'?"
        )
    ) {
        return;
    }


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    delete cenas[nome];


    localStorage.setItem(
        "mesaSomCenas",
        JSON.stringify(
            cenas
        )
    );


    atualizarListaCenas();
}

/* =====================================================
   EFEITOS
===================================================== */

let canalEfeitosAtual = null;


function abrirEfeitos(canal) {

    canalEfeitosAtual = canal;

    const modal =
        document.getElementById(
            "modalEfeitos"
        );

    modal.classList.add(
        "aberto"
    );

}


function fecharEfeitos() {

    document
        .getElementById(
            "modalEfeitos"
        )
        .classList.remove(
            "aberto"
        );

    canalEfeitosAtual = null;

}

/* =====================================================
   CRIAR OS 10 CANAIS
===================================================== */

for (
    let i = 0;
    i < 10;
    i++
) {

    const mesa =
        document.getElementById(
            "mesa"
        );


    const botao =
        document.getElementById(
            "botaoAdicionar"
        );


    mesa.insertBefore(
        criarCanal(),
        botao
    );
}


/* =====================================================
   KNOBS MASTER
===================================================== */

document
    .querySelectorAll(
        ".master .knob"
    )
    .forEach(
        configurarKnob
    );


/* =====================================================
   CONFIGURAÇÃO AUTOMÁTICA
===================================================== */

try {

    const abriuCompartilhada =
        carregarMesaCompartilhada();

    if (!abriuCompartilhada) {

        const salvo =
            localStorage.getItem(
                "mesaSomAuto"
            );

        if (salvo) {

            const estado =
                JSON.parse(
                    salvo
                );

            aplicarEstado(
                estado
            );

        }

    }

} catch(e) {

    console.log(
        "Não foi possível restaurar a mesa."
    );

}


atualizarContador();

</script>
