<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MIXER PRO</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

body {
    overflow-x: auto;
}


/* =========================================================
   TOPO
========================================================= */

header {

    min-height: 65px;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border-bottom: 2px solid #000;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 15px;

    position: sticky;

    top: 0;

    z-index: 100;

    flex-wrap: wrap;
}


.logo {

    color: #00ff88;

    font-size: 20px;

    font-weight: bold;

    letter-spacing: 2px;

    margin-right: 10px;
}


.top-btn {

    background: #222;

    border: 1px solid #555;

    color: #ddd;

    padding: 9px 12px;

    border-radius: 5px;

    cursor: pointer;

    font-size: 11px;

    font-weight: bold;
}


.top-btn:hover {

    background: #333;
}


.top-btn.green {

    color: #00ff88;

    border-color: #00ff88;
}


.top-btn.red {

    color: #ff5555;

    border-color: #aa3333;
}


.top-btn.blue {

    color: #55aaff;

    border-color: #336699;
}


.status {

    margin-left: auto;

    color: #777;

    font-size: 10px;
}


.status span {

    color: #00ff88;
}


/* =========================================================
   MESA
========================================================= */

.mesa-area {

    padding: 15px;
}


.mesa {

    display: flex;

    gap: 7px;

    align-items: stretch;

    min-width: max-content;
}


/* =========================================================
   CANAL
========================================================= */

.canal {

    width: 155px;

    min-height: 900px;

    background:
        linear-gradient(
            90deg,
            #111,
            #292929,
            #111
        );

    border: 1px solid #444;

    border-radius: 6px;

    padding: 8px;

    box-shadow:
        inset 0 0 15px #000,
        0 5px 15px #000;

    position: relative;
}


.canal.mutado {

    opacity: .45;
}


.canal.solo-canal {

    border-color: #ffd400;

    box-shadow:
        0 0 10px #ffd400,
        inset 0 0 15px #000;
}


/* =========================================================
   CABEÇALHO
========================================================= */

.cabecalho-canal {

    background: #0b0b0b;

    border-bottom: 2px solid #00ff88;

    border-radius: 4px;

    padding: 5px;

    text-align: center;

    margin-bottom: 7px;
}


.cabecalho-canal strong {

    color: #00ff88;

    font-size: 12px;
}


.cabecalho-canal small {

    display: block;

    color: #777;

    font-size: 8px;

    margin-top: 3px;
}


.nome {

    width: 100%;

    margin-top: 5px;

    padding: 5px;

    background: #111;

    color: #00ff88;

    border: 1px solid #444;

    border-radius: 4px;

    text-align: center;

    outline: none;

    font-size: 10px;
}


.nome:focus {

    border-color: #00ff88;
}


/* =========================================================
   SEÇÕES
========================================================= */

.secao {

    border-bottom: 1px solid #3b3b3b;

    padding: 8px 0;
}


.titulo {

    color: #777;

    text-align: center;

    font-size: 8px;

    letter-spacing: 1px;

    margin-bottom: 7px;
}


/* =========================================================
   BOTÕES
========================================================= */

.botoes {

    display: flex;

    gap: 4px;
}


.btn {

    flex: 1;

    background: #222;

    color: #aaa;

    border: 1px solid #444;

    border-radius: 4px;

    padding: 7px 2px;

    cursor: pointer;

    font-size: 8px;

    font-weight: bold;
}


.btn:hover {

    background: #333;
}


.btn.play {

    color: #00ff88;
}


.btn.play.ativo {

    background: #00aa55;

    color: white;

    box-shadow:
        0 0 8px
        rgba(0,255,136,.4);
}


.btn.mute.ativo {

    background: #e00000;

    color: white;
}


.btn.solo.ativo {

    background: #ffd400;

    color: black;
}


.btn.copy {

    color: #55aaff;
}


.btn.paste {

    color: #ffbb55;
}


.remove {

    width: 100%;

    color: #ff5555;
}


/* =========================================================
   KNOBS
========================================================= */

.knobs {

    display: flex;

    justify-content: space-around;
}


.knob-box {

    width: 42px;

    text-align: center;
}


.knob {

    width: 38px;

    height: 38px;

    border-radius: 50%;

    position: relative;

    cursor: ns-resize;

    touch-action: none;

    user-select: none;

    background:
        radial-gradient(
            circle at 32% 28%,
            #999,
            #555 32%,
            #181818 70%
        );

    border: 2px solid #080808;

    box-shadow:
        0 3px 5px #000,
        inset 0 1px 3px #aaa;
}


.knob::after {

    content: "";

    position: absolute;

    width: 3px;

    height: 11px;

    background: #00ff88;

    top: 3px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius: 2px;

    box-shadow:
        0 0 6px #00ff88;
}


.knob-box label {

    display: block;

    color: #aaa;

    font-size: 7px;

    margin-top: 3px;
}


.valor-knob {

    color: #00ff88;

    font-size: 7px;
}


/* =========================================================
   SLIDERS
========================================================= */

.slider {

    width: 100%;

    accent-color: #00ff88;

    cursor: pointer;
}


.fader-area {

    height: 180px;

    display: flex;

    justify-content: center;

    align-items: center;
}


.fader {

    width: 165px;

    transform: rotate(-90deg);

    accent-color: #00ff88;
}


.valor-fader {

    display: block;

    text-align: center;

    color: #00ff88;

    font-size: 9px;

    margin-top: 4px;
}


/* =========================================================
   ARQUIVO
========================================================= */

.audio-file {

    width: 100%;

    color: #aaa;

    font-size: 7px;
}


.audio-file::file-selector-button {

    background: #222;

    color: #ddd;

    border: 1px solid #555;

    border-radius: 4px;

    padding: 4px;
}


.info-arquivo {

    color: #666;

    font-size: 7px;

    text-align: center;

    margin-top: 4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* =========================================================
   YOUTUBE
========================================================= */

.youtube-url {

    width: 100%;

    margin-top: 6px;

    padding: 6px;

    background: #111;

    color: white;

    border: 1px solid #444;

    border-radius: 4px;

    font-size: 8px;
}


.youtube-btn {

    width: 100%;

    margin-top: 5px;

    color: #ff5555;
}


.youtube-player {

    width: 1px;

    height: 1px;

    position: absolute;

    left: -9999px;

    top: -9999px;

    overflow: hidden;
}


/* =========================================================
   SEEK
========================================================= */

.player-tempo {

    display: flex;

    justify-content: space-between;

    color: #777;

    font-size: 7px;

    margin-bottom: 4px;
}


.tempo-atual {

    color: #00ff88;
}


.seek {

    width: 100%;

    height: 5px;

    accent-color: #00ff88;

    cursor: pointer;
}


/* =========================================================
   METER
========================================================= */

.meter-area {

    height: 145px;

    display: flex;

    justify-content: center;

    align-items: center;
}


.meter {

    width: 17px;

    height: 135px;

    background: #080808;

    border: 1px solid #333;

    padding: 3px;

    display: flex;

    flex-direction: column-reverse;

    gap: 2px;
}


.led {

    width: 100%;

    height: 5px;

    background: #171717;

    border-radius: 2px;
}


.led.verde {

    background: #00ff44;

    box-shadow:
        0 0 6px #00ff44;
}


.led.amarelo {

    background: #ffff00;

    box-shadow:
        0 0 6px #ffff00;
}


.led.vermelho {

    background: #ff2222;

    box-shadow:
        0 0 7px red;
}


/* =========================================================
   ADICIONAR
========================================================= */

.add-canal {

    width: 155px;

    min-height: 900px;

    border: 2px dashed #444;

    border-radius: 6px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    color: #666;

    cursor: pointer;
}


.add-canal:hover {

    color: #00ff88;

    border-color: #00ff88;
}


.add-icon {

    font-size: 45px;
}


/* =========================================================
   MASTER
========================================================= */

.master {

    width: 180px;
}


.master .cabecalho-canal {

    border-color: #ff9900;
}


.master .cabecalho-canal strong {

    color: #ff9900;
}


/* =========================================================
   MODAIS
========================================================= */

.modal {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.8);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 500;
}


.modal.aberto {

    display: flex;
}


.caixa-modal {

    width: 370px;

    max-width: 90%;

    background:
        linear-gradient(
            #292929,
            #111
        );

    border: 1px solid #555;

    border-radius: 8px;

    padding: 20px;

    box-shadow:
        0 10px 40px #000;
}


.caixa-modal h2 {

    color: #00ff88;

    text-align: center;
}


.input-cena {

    width: 100%;

    padding: 10px;

    background: #111;

    border: 1px solid #555;

    color: white;

    border-radius: 4px;

    margin-bottom: 10px;
}


.lista-cenas {

    max-height: 250px;

    overflow-y: auto;

    margin-top: 15px;
}


.item-cena {

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: #1b1b1b;

    border-bottom: 1px solid #333;

    padding: 8px;

    font-size: 10px;
}


.item-cena button {

    background: #333;

    color: white;

    border: 1px solid #555;

    padding: 5px;

    cursor: pointer;

    margin-left: 3px;
}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================= -->

<header>

    <div class="logo">
        MIXER PRO
    </div>


    <button
        class="top-btn green"
        onclick="iniciarAudio()">

        🔊 ÁUDIO

    </button>


    <button
        class="top-btn green"
        onclick="playTodos()">

        ▶ PLAY TODOS

    </button>


    <button
        class="top-btn"
        onclick="pausarTodos()">

    </button>


    <button
        class="top-btn red"

    </button>

    <button
        class="top-btn"
        onclick="adicionarCanal()">

    </button>


    <button
        class="top-btn"

        onclick="salvarCenaRapida()">

        ÁUDIO:

        </span>

</header>


<!-- =======================================================
     MESA

<div class="mesa-area">

    <div
        class="mesa"
        id="mesa">


        <!-- BOTÃO ADICIONAR -->

        <div
            class="add-canal"
            id="botaoAdicionar"
            onclick="adicionarCanal()">

                        <div

                            class="knob"

                        </label>

                        </span>

                    </div>


                    <div class="knob-box">

                        <div
                            class="knob"
                            data-tipo="masterLow"

                        </div>

                        <label>
                            GRAVE
                        </label>

                        <span class="valor-knob">

                    </div>

            <!-- MASTER FADER -->

            <div class="secao">

                    <input
                        id="masterFader"

                </div>


                <span
                    class="valor-fader"

            <!-- MASTER MUTE -->

            <div class="secao">

                <button

            <!-- TRANSPORTE -->

            <div class="secao">

                <div class="titulo">

                <div
                    style="

                        text-align:center;

                    ">

        </div>

    </div>

</div>


<!-- =======================================================
     MODAL CENAS
======================================================= -->

<div
    class="modal"
    id="modalCenas">


    <div class="caixa-modal">


        <h2>
            💾 CENAS
        </h2>


        <input
            class="input-cena"
            id="nomeCena"
            placeholder="Nome da cena">


        <button
            class="top-btn green"
            style="width:100%"
            onclick="salvarCena()">

            SALVAR CENA

        </button>


        <div
            class="lista-cenas"
            id="listaCenas">
        </div>


        <br>


        <button
            class="top-btn"
            style="width:100%"
            onclick="fecharCenas()">

            FECHAR

        </button>

    </div>

</div>


<!-- =======================================================
     JAVASCRIPT
======================================================= -->

<script>


/* =========================================================
   VARIÁVEIS
========================================================= */

let audioContext = null;

let masterGain = null;

let masterHigh = null;

let masterMid = null;

let masterLow = null;

let canais = [];

let numeroCanal = 0;

let canalCopiado = null;

let youtubeAPIPronta = false;


/* =========================================================
   YOUTUBE API
========================================================= */

function onYouTubeIframeAPIReady() {

    youtubeAPIPronta = true;

    console.log(
        "YouTube API pronta."
    );
}


/* =========================================================
   INICIAR AUDIO
========================================================= */

async function iniciarAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        /* MASTER EQ */

        masterHigh =
            audioContext.createBiquadFilter();

        masterHigh.type =
            "highshelf";

        masterHigh.frequency.value =
            6000;


        masterMid =
            audioContext.createBiquadFilter();

        masterMid.type =
            "peaking";

        masterMid.frequency.value =
            1000;

        masterMid.Q.value =
            1;


        masterLow =
            audioContext.createBiquadFilter();

        masterLow.type =
            "lowshelf";

        masterLow.frequency.value =
            120;


        masterGain =
            audioContext.createGain();


        masterHigh.connect(
            masterMid
        );

        masterMid.connect(
            masterLow
        );

        masterLow.connect(
            masterGain
        );

        masterGain.connect(
            audioContext.destination
        );


        aplicarVolumeMaster();
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        await audioContext.resume();
    }


    document.getElementById(
        "statusAudio"
    ).textContent =
        "ATIVO";
}


/* =========================================================
   METER
========================================================= */

function criarMeter() {

    const meter =
        document.createElement(
            "div"
        );

    meter.className =
        "meter";


    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const led =
            document.createElement(
                "div"
            );

        led.className =
            "led";

        meter.appendChild(
            led
        );
    }


    return meter;
}


/* =========================================================
   CRIAR CANAL
========================================================= */

function criarCanal() {

    numeroCanal++;

    const numero =
        numeroCanal;


    const canal =
        document.createElement(
            "div"
        );

    canal.className =
        "canal";


    canal.dataset.numero =
        numero;


    canal.innerHTML = `

        <div class="secao">

            <div class="titulo">
                ÁUDIO / YOUTUBE
            </div>


            <input
                type="file"
                class="audio-file"
                accept="audio/*"
            >


            <input
                type="text"
                class="youtube-url"
                placeholder="Cole aqui o link do YouTube"
            >


            <button
                class="btn youtube-btn">

                ▶ CARREGAR YOUTUBE

            </button>


            <div class="youtube-player"></div>


            <div class="info-arquivo">

                Nenhum áudio selecionado

            </div>

        </div>


        <div class="cabecalho-canal">

            <strong>
                CH ${numero}
            </strong>

            <small>
                INPUT ${numero}
            </small>

            <input
                class="nome"
                value="Canal ${numero}"
            >

        </div>


        <div class="secao">

            <div class="titulo">
                PLAYBACK
            </div>


            <div class="player-tempo">

                <span class="tempo-atual">
                    00:00
                </span>

                <span class="tempo-total">
                    00:00
                </span>

            </div>


            <input
                class="seek"
                type="range"
                min="0"
                max="0"
                step="0.01"
                value="0"
            >

        </div>


        <div class="secao">

            <div class="titulo">
                PREAMP / GAIN
            </div>


            <div class="knobs">

                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="gain"
                        data-valor="0">
                    </div>

                    <label>
                        GAIN
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>

            </div>

        </div>


        <div class="secao">

            <div class="titulo">
                EQUALIZADOR
            </div>


            <div class="knobs">


                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="high"
                        data-valor="0">
                    </div>

                    <label>
                        AGUDO
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>


                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="mid"
                        data-valor="0">
                    </div>

                    <label>
                        MÉDIO
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>


                <div class="knob-box">

                    <div
                        class="knob"
                        data-tipo="low"
                        data-valor="0">
                    </div>

                    <label>
                        GRAVE
                    </label>

                    <span class="valor-knob">
                        0 dB
                    </span>

                </div>


            </div>

        </div>


        <div class="secao">

            <div class="titulo">
                PAN
            </div>


            <input
                class="slider pan"
                type="range"
                min="-100"
                max="100"
                value="0"
            >

        </div>


        <div class="secao">

            <div class="titulo">
                CONTROLE
            </div>


            <div class="botoes">

                <button class="btn play">
                    ▶ PLAY
                </button>

                <button class="btn solo">
                    SOLO
                </button>

                <button class="btn mute">
                    MUTE
                </button>

            </div>

        </div>


        <div class="secao">

            <div class="titulo">
                SIGNAL
            </div>


            <div class="meter-area"></div>

        </div>


        <div class="secao">

            <div class="titulo">
                CHANNEL LEVEL
            </div>


            <div class="fader-area">

                <input
                    class="fader"
                    type="range"
                    min="0"
                    max="100"
                    value="75"
                >

            </div>


            <span class="valor-fader">
                75%
            </span>

        </div>


        <div class="secao">

            <div class="botoes">

                <button class="btn copy">
                    📋 COPIAR
                </button>

                <button class="btn paste">
                    📥 COLAR
                </button>

            </div>

        </div>


        <div class="secao">

            <button
                class="btn remove">

                🗑 REMOVER CANAL

            </button>

        </div>
    `;


    /* =====================================================
       ESTADO
    ===================================================== */

    canal.audioBuffer = null;

    canal.source = null;

    canal.preampGain = null;

    canal.channelGain = null;

    canal.highFilter = null;

    canal.midFilter = null;

    canal.lowFilter = null;

    canal.panner = null;

    canal.analyser = null;

    canal.ytPlayer = null;

    canal.youtubeUrl = "";

    canal.youtubeId = "";

    canal.offset = 0;

    canal.startTime = 0;

    canal.playing = false;

    canal.pausando = false;

    canal.fileName = "";


    /* =====================================================
       METER
    ===================================================== */

    canal.querySelector(
        ".meter-area"
    ).appendChild(
        criarMeter()
    );


    /* =====================================================
       ARQUIVO
    ===================================================== */

    canal.querySelector(
        ".audio-file"
    ).addEventListener(
        "change",
        function() {

            carregarArquivo(
                this.files[0],
                canal
            );

        }
    );


    /* =====================================================
       YOUTUBE
    ===================================================== */

    canal.querySelector(
        ".youtube-btn"
    ).addEventListener(
        "click",
        function() {

            carregarYouTube(
                canal
            );

        }
    );


    /* =====================================================
       PLAY
    ===================================================== */

    canal.querySelector(
        ".play"
    ).addEventListener(
        "click",
        function() {

            alternarPlay(
                canal
            );

        }
    );


    /* =====================================================
       FADER
    ===================================================== */

    canal.querySelector(
        ".fader"
    ).addEventListener(
        "input",
        function() {

            const valor =
                Number(
                    this.value
                );


            canal.querySelector(
                ".valor-fader"
            ).textContent =
                valor + "%";


            if (
                canal.channelGain
            ) {

                atualizarVolumeCanal(
                    canal
                );
            }


            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.setVolume(
                        valor
                    );

                } catch(e) {}

            }


            salvarAutomaticamente();

        }
    );


    /* =====================================================
       MUTE
    ===================================================== */

    canal.querySelector(
        ".mute"
    ).addEventListener(
        "click",
        function() {

            this.classList.toggle(
                "ativo"
            );


            const mutado =
                this.classList.contains(
                    "ativo"
                );


            canal.classList.toggle(
                "mutado",
                mutado
            );


            if (
                canal.channelGain
            ) {

                atualizarVolumeCanal(
                    canal
                );
            }


            if (
                canal.ytPlayer
            ) {

                try {

                    if (mutado) {

                        canal.ytPlayer.mute();

                    } else {

                        canal.ytPlayer.unMute();

                        canal.ytPlayer.setVolume(
                            Number(
                                canal.querySelector(
                                    ".fader"
                                ).value
                            )
                        );

                    }

                } catch(e) {}

            }


            salvarAutomaticamente();

        }
    );


    /* =====================================================
       SOLO
    ===================================================== */

    canal.querySelector(
        ".solo"
    ).addEventListener(
        "click",
        function() {

            this.classList.toggle(
                "ativo"
            );


            canal.classList.toggle(
                "solo-canal",
                this.classList.contains(
                    "ativo"
                )
            );


            atualizarSolos();

            salvarAutomaticamente();

        }
    );


    /* =====================================================
       SEEK
    ===================================================== */

    canal.querySelector(
        ".seek"
    ).addEventListener(
        "input",
        function() {

            const posicao =
                Number(
                    this.value
                );


            if (
                canal.ytPlayer
            ) {

                try {

                    canal.offset =
                        posicao;

                    canal.ytPlayer.seekTo(
                        posicao,
                        true
                    );

                    atualizarTempoCanal(
                        canal,
                        posicao
                    );

                } catch(e) {}

                return;
            }


            canal.offset =
                posicao;


            atualizarTempoCanal(
                canal,
                posicao
            );


            if (
                canal.playing
            ) {

                reiniciarCanalNaPosicao(
                    canal,
                    posicao
                );
            }

        }
    );


    /* =====================================================
       PAN
    ===================================================== */

    canal.querySelector(
        ".pan"
    ).addEventListener(
        "input",
        function() {

            if (
                canal.panner
            ) {

                canal.panner.pan.value =
                    Number(
                        this.value
                    ) / 100;
            }


            salvarAutomaticamente();

        }
    );


    /* =====================================================
       COPIAR
    ===================================================== */

    canal.querySelector(
        ".copy"
    ).addEventListener(
        "click",
        function() {

            copiarCanal(
                canal
            );

        }
    );


    /* =====================================================
       COLAR
    ===================================================== */

    canal.querySelector(
        ".paste"
    ).addEventListener(
        "click",
        function() {

            colarCanal(
                canal
            );

        }
    );


    /* =====================================================
       REMOVER
    ===================================================== */

    canal.querySelector(
        ".remove"
    ).addEventListener(
        "click",
        function() {

            removerCanal(
                canal
            );

        }
    );


    /* =====================================================
       NOME
    ===================================================== */

    canal.querySelector(
        ".nome"
    ).addEventListener(
        "input",
        salvarAutomaticamente
    );


    /* =====================================================
       KNOBS
    ===================================================== */

    canal.querySelectorAll(
        ".knob"
    ).forEach(
        configurarKnob
    );


    canais.push(
        canal
    );


    atualizarContador();


    return canal;
}


/* =========================================================
   YOUTUBE ID
========================================================= */

function obterYoutubeId(url) {

    if (!url)
        return null;


    try {

        const endereco =
            new URL(url);


        if (
            endereco.hostname.includes(
                "youtube.com"
            )
        ) {

            return endereco.searchParams.get(
                "v"
            );

        }


        if (
            endereco.hostname.includes(
                "youtu.be"
            )
        ) {

            return endereco.pathname
                .substring(1);

        }

    } catch(e) {

        return null;
    }


    return null;
}


/* =========================================================
   CARREGAR YOUTUBE
========================================================= */

function carregarYouTube(
    canal
) {

    if (
        !youtubeAPIPronta ||
        typeof YT === "undefined"
    ) {

        alert(
            "A API do YouTube ainda está carregando. Tente novamente."
        );

        return;
    }


    const campo =
        canal.querySelector(
            ".youtube-url"
        );


    const url =
        campo.value.trim();


    const id =
        obterYoutubeId(
            url
        );


    if (!id) {

        alert(
            "Link do YouTube inválido."
        );

        return;
    }


    /* Remove áudio local */

    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}

        canal.source =
            null;
    }


    canal.audioBuffer =
        null;

    canal.youtubeUrl =
        url;

    canal.youtubeId =
        id;

    canal.offset =
        0;


    const playerDiv =
        canal.querySelector(
            ".youtube-player"
        );


    playerDiv.innerHTML = "";


    const elemento =
        document.createElement(
            "div"
        );


    playerDiv.appendChild(
        elemento
    );


    canal.ytPlayer =
        new YT.Player(
            elemento,
            {

                width: "1",

                height: "1",

                videoId: id,

                playerVars: {

                    autoplay: 0,

                    controls: 0,

                    rel: 0,

                    modestbranding: 1

                },


                events: {

                    onReady:
                    function(event) {

                        const duracao =
                            event.target
                                .getDuration();


                        const seek =
                            canal.querySelector(
                                ".seek"
                            );


                        seek.max =
                            duracao;

                        seek.value =
                            0;


                        canal.querySelector(
                            ".tempo-total"
                        ).textContent =
                            formatarTempo(
                                duracao
                            );


                        const volume =
                            Number(
                                canal.querySelector(
                                    ".fader"
                                ).value
                            );


                        event.target.setVolume(
                            volume
                        );


                        canal.querySelector(
                            ".info-arquivo"
                        ).textContent =
                            "YouTube carregado";

                    },


                    onStateChange:
                    function(event) {

                        if (
                            event.data ===
                            YT.PlayerState.PLAYING
                        ) {

                            canal.playing =
                                true;

                        }


                        if (
                            event.data ===
                            YT.PlayerState.PAUSED
                        ) {

                            canal.playing =
                                false;

                        }


                        if (
                            event.data ===
                            YT.PlayerState.ENDED
                        ) {

                            canal.playing =
                                false;

                            canal.offset =
                                0;

                            canal.querySelector(
                                ".seek"
                            ).value =
                                0;

                        }


                        atualizarBotaoPlay(
                            canal
                        );

                    }

                }

            }
        );


    salvarAutomaticamente();
}


/* =========================================================
   CARREGAR ARQUIVO
========================================================= */

async function carregarArquivo(
    arquivo,
    canal
) {

    if (!arquivo)
        return;


    await iniciarAudio();


    const dados =
        await arquivo.arrayBuffer();


    try {

        canal.audioBuffer =
            await audioContext.decodeAudioData(
                dados
            );

    } catch(e) {

        alert(
            "Não foi possível abrir este arquivo de áudio."
        );

        return;
    }


    canal.fileName =
        arquivo.name;


    canal.youtubeUrl =
        "";

    canal.youtubeId =
        "";

    canal.ytPlayer =
        null;


    canal.offset =
        0;


    const seek =
        canal.querySelector(
            ".seek"
        );


    seek.max =
        canal.audioBuffer.duration;


    seek.value =
        0;


    canal.querySelector(
        ".tempo-total"
    ).textContent =
        formatarTempo(
            canal.audioBuffer.duration
        );


    canal.querySelector(
        ".tempo-atual"
    ).textContent =
        "00:00";


    canal.querySelector(
        ".info-arquivo"
    ).textContent =
        arquivo.name;


    criarAudioCanal(
        canal
    );


    salvarAutomaticamente();
}


/* =========================================================
   CRIAR CADEIA LOCAL
========================================================= */

function criarAudioCanal(
    canal
) {

    if (
        !canal.audioBuffer ||
        !audioContext
    )
        return;


    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}

    }


    const source =
        audioContext.createBufferSource();


    source.buffer =
        canal.audioBuffer;


    const preamp =
        audioContext.createGain();


    const high =
        audioContext.createBiquadFilter();


    high.type =
        "highshelf";

    high.frequency.value =
        6000;


    const mid =
        audioContext.createBiquadFilter();


    mid.type =
        "peaking";

    mid.frequency.value =
        1000;

    mid.Q.value =
        1;


    const low =
        audioContext.createBiquadFilter();


    low.type =
        "lowshelf";

    low.frequency.value =
        120;


    const channelGain =
        audioContext.createGain();


    const panner =
        audioContext.createStereoPanner();


    const analyser =
        audioContext.createAnalyser();


    analyser.fftSize =
        256;


    /* =====================================================
       CONEXÃO
    ===================================================== */

    source.connect(
        preamp
    );


    preamp.connect(
        high
    );


    high.connect(
        mid
    );


    mid.connect(
        low
    );


    low.connect(
        channelGain
    );


    channelGain.connect(
        panner
    );


    panner.connect(
        analyser
    );


    analyser.connect(
        masterHigh
    );


    canal.source =
        source;

    canal.preampGain =
        preamp;

    canal.highFilter =
        high;

    canal.midFilter =
        mid;

    canal.lowFilter =
        low;

    canal.channelGain =
        channelGain;

    canal.panner =
        panner;

    canal.analyser =
        analyser;


    aplicarControlesCanal(
        canal
    );


    iniciarMeter(
        canal
    );


    source.onended =
        function() {

            if (
                canal.pausando
            )
                return;


            if (
                canal.playing
            ) {

                canal.playing =
                    false;

                canal.offset =
                    0;

                atualizarBotaoPlay(
                    canal
                );

            }

        };
}


/* =========================================================
   PLAY / PAUSE
========================================================= */

async function alternarPlay(
    canal
) {

    /* YOUTUBE */

    if (
        canal.ytPlayer
    ) {

        try {

            const estado =
                canal.ytPlayer
                    .getPlayerState();


            if (
                estado ===
                YT.PlayerState.PLAYING
            ) {

                canal.ytPlayer.pauseVideo();

            } else {

                canal.ytPlayer.playVideo();

            }

        } catch(e) {}

        return;
    }


    /* LOCAL */

    if (
        !canal.audioBuffer
    ) {

        alert(
            "Escolha um arquivo de áudio ou carregue um vídeo do YouTube."
        );

        return;
    }


    await iniciarAudio();


    if (
        !canal.playing
    ) {

        iniciarCanalNaPosicao(
            canal,
            canal.offset
        );

    } else {

        pausarCanal(
            canal
        );
    }
}


/* =========================================================
   INICIAR CANAL
========================================================= */

function iniciarCanalNaPosicao(
    canal,
    posicao
) {

    criarAudioCanal(
        canal
    );


    canal.offset =
        Math.max(
            0,
            Math.min(
                posicao,
                canal.audioBuffer.duration
            )
        );


    canal.startTime =
        audioContext.currentTime -
        canal.offset;


    canal.source.start(
        0,
        canal.offset
    );


    canal.playing =
        true;


    atualizarBotaoPlay(
        canal
    );
}


/* =========================================================
   PAUSAR
========================================================= */

function pausarCanal(
    canal
) {

    if (
        !canal.playing
    )
        return;


    const decorrido =
        audioContext.currentTime -
        canal.startTime;


    canal.offset +=
        decorrido;


    canal.offset =
        Math.max(
            0,
            Math.min(
                canal.offset,
                canal.audioBuffer.duration
            )
        );


    canal.pausando =
        true;


    try {

        canal.source.stop();

    } catch(e) {}


    canal.source =
        null;

    canal.playing =
        false;

    canal.pausando =
        false;


    atualizarBotaoPlay(
        canal
    );
}


/* =========================================================
   SEEK LOCAL
========================================================= */

function reiniciarCanalNaPosicao(
    canal,
    posicao
) {

    if (
        !canal.audioBuffer ||
        !canal.playing
    )
        return;


    try {

        canal.source.stop();

    } catch(e) {}


    criarAudioCanal(
        canal
    );


    canal.offset =
        posicao;


    canal.startTime =
        audioContext.currentTime -
        posicao;


    canal.source.start(
        0,
        posicao
    );
}


/* =========================================================
   BOTÃO PLAY
========================================================= */

function atualizarBotaoPlay(
    canal
) {

    const botao =
        canal.querySelector(
            ".play"
        );


    if (
        canal.playing
    ) {

        botao.textContent =
            "⏸ PAUSE";

        botao.classList.add(
            "ativo"
        );

    } else {

        botao.textContent =
            "▶ PLAY";

        botao.classList.remove(
            "ativo"
        );
    }
}


/* =========================================================
   VOLUME
========================================================= */

function atualizarVolumeCanal(
    canal
) {

    if (
        !canal.channelGain
    )
        return;


    const fader =
        Number(
            canal.querySelector(
                ".fader"
            ).value
        );


    const mute =
        canal.querySelector(
            ".mute"
        ).classList.contains(
            "ativo"
        );


    const existeSolo =
        canais.some(
            c =>
                c.querySelector(
                    ".solo"
                ).classList.contains(
                    "ativo"
                )
        );


    const esteSolo =
        canal.querySelector(
            ".solo"
        ).classList.contains(
            "ativo"
        );


    if (
        mute
    ) {

        canal.channelGain.gain.value =
            0;

    } else if (
        existeSolo &&
        !esteSolo
    ) {

        canal.channelGain.gain.value =
            0;

    } else {

        canal.channelGain.gain.value =
            fader / 100;
    }
}


/* =========================================================
   PREAMP
========================================================= */

function aplicarPreamp(
    canal,
    valor
) {

    if (
        !canal.preampGain
    )
        return;


    canal.preampGain.gain.value =
        Math.pow(
            10,
            valor / 20
        );
}


/* =========================================================
   CONTROLES DO CANAL
========================================================= */

function aplicarControlesCanal(
    canal
) {

    canal.querySelectorAll(
        ".knob"
    ).forEach(
        knob => {

            const tipo =
                knob.dataset.tipo;


            const valor =
                Number(
                    knob.dataset.valor
                );


            if (
                tipo === "gain"
            ) {

                aplicarPreamp(
                    canal,
                    valor
                );
            }


            if (
                tipo === "high" &&
                canal.highFilter
            ) {

                canal.highFilter.gain.value =
                    valor;
            }


            if (
                tipo === "mid" &&
                canal.midFilter
            ) {

                canal.midFilter.gain.value =
                    valor;
            }


            if (
                tipo === "low" &&
                canal.lowFilter
            ) {

                canal.lowFilter.gain.value =
                    valor;
            }

        }
    );


    if (
        canal.panner
    ) {

        canal.panner.pan.value =
            Number(
                canal.querySelector(
                    ".pan"
                ).value
            ) / 100;
    }


    atualizarVolumeCanal(
        canal
    );
}


/* =========================================================
   SOLO
========================================================= */

function atualizarSolos() {

    canais.forEach(
        canal => {

            atualizarVolumeCanal(
                canal
            );

        }
    );
}


/* =========================================================
   KNOBS
========================================================= */

function configurarKnob(
    knob
) {

    let valor =
        Number(
            knob.dataset.valor
        );


    let inicioY = 0;

    let inicioValor = 0;


    function atualizar() {

        valor =
            Math.max(
                -12,
                Math.min(
                    12,
                    valor
                )
            );


        knob.dataset.valor =
            valor;


        atualizarVisualKnob(
            knob
        );


        const canal =
            knob.closest(
                ".canal"
            );


        if (
            canal &&
            canal.classList.contains(
                "master"
            )
        ) {

            aplicarMasterKnob(
                knob,
                valor
            );

        } else if (
            canal
        ) {

            aplicarControlesCanal(
                canal
            );
        }


        salvarAutomaticamente();
    }


    knob.addEventListener(
        "mousedown",
        function(e) {

            inicioY =
                e.clientY;

            inicioValor =
                valor;


            function mover(ev) {

                const diferenca =
                    inicioY -
                    ev.clientY;


                valor =
                    inicioValor +
                    Math.round(
                        diferenca / 5
                    );


                atualizar();
            }


            function soltar() {

                document.removeEventListener(
                    "mousemove",
                    mover
                );


                document.removeEventListener(
                    "mouseup",
                    soltar
                );
            }


            document.addEventListener(
                "mousemove",
                mover
            );


            document.addEventListener(
                "mouseup",
                soltar
            );

        }
    );


    atualizarVisualKnob(
        knob
    );
}


/* =========================================================
   VISUAL KNOB
========================================================= */

function atualizarVisualKnob(
    knob
) {

    const valor =
        Number(
            knob.dataset.valor
        );


    const graus =
        -135 +
        (
            (valor + 12) /
            24
        ) * 270;


    knob.style.transform =
        "rotate(" +
        graus +
        "deg)";


    const texto =
        knob.parentElement.querySelector(
            ".valor-knob"
        );


    if (
        texto
    ) {

        texto.textContent =
            valor > 0
            ? "+" + valor + " dB"
            : valor + " dB";
    }
}


/* =========================================================
   MASTER EQ
========================================================= */

function aplicarMasterKnob(
    knob,
    valor
) {

    if (
        !audioContext
    )
        return;


    const tipo =
        knob.dataset.tipo;


    if (
        tipo === "masterHigh" &&
        masterHigh
    ) {

        masterHigh.gain.value =
            valor;
    }


    if (
        tipo === "masterMid" &&
        masterMid
    ) {

        masterMid.gain.value =
            valor;
    }


    if (
        tipo === "masterLow" &&
        masterLow
    ) {

        masterLow.gain.value =
            valor;
    }
}

function aplicarVolumeMaster() {

/* =========================================================
   METER
========================================================= */

function iniciarMeter(
    canal
) {

    if (
        !canal.analyser
    )
        return;


    const meter =
        canal.querySelector(
            ".meter"
        );


    if (
        !meter
    )
        return;


    const leds =
        meter.querySelectorAll(
            ".led"
        );


    const dados =
        new Uint8Array(
            canal.analyser.fftSize
        );


    function atualizar() {

        if (
            !canal.analyser
        )
            return;


        canal.analyser.getByteTimeDomainData(
            dados
        );


        let soma = 0;


        for (
            let i = 0;
            i < dados.length;
            i++
        ) {

            const v =
                (
                    dados[i] -
                    128
                ) / 128;


            soma +=
                v * v;
        }


        const rms =
            Math.sqrt(
                soma /
                dados.length
            );


        const nivel =
            Math.min(
                20,
                Math.floor(
                    rms * 55
                )
            );


        leds.forEach(
            (led, i) => {

                led.className =
                    "led";


                if (
                    i < nivel
                ) {

                    if (
                        i < 13
                    ) {

                        led.classList.add(
                            "verde"
                        );

                    } else if (
                        i < 17
                    ) {

                        led.classList.add(
                            "amarelo"
                        );

                    } else {

                        led.classList.add(
                            "vermelho"
                        );
                    }
                }
            }
        );


        requestAnimationFrame(
            atualizar
        );
    }


    atualizar();
}


/* =========================================================
   TEMPO
========================================================= */

function formatarTempo(
    segundos
) {

    if (
        !isFinite(segundos) ||
        segundos < 0
    ) {

        return "00:00";
    }


    segundos =
        Math.floor(
            segundos
        );


    const minutos =
        Math.floor(
            segundos / 60
        );


    const segundosRestantes =
        segundos % 60;


    return String(
        minutos
    ).padStart(
        2,
        "0"
    )
    +
    ":"
    +
    String(
        segundosRestantes
    ).padStart(
        2,
        "0"
    );
}


/* =========================================================
   ATUALIZAR TEMPO
========================================================= */

function atualizarTempoCanal(
    canal,
    posicao
) {

    const tempo =
        canal.querySelector(
            ".tempo-atual"
        );


    if (
        tempo
    ) {

        tempo.textContent =
            formatarTempo(
                posicao
            );
    }
}


/* =========================================================
   RELÓGIO
========================================================= */

function atualizarRelogio() {

    canais.forEach(
        canal => {


            /* YOUTUBE */

            if (
                canal.ytPlayer &&
                canal.playing
            ) {

                try {

                    const atual =
                        canal.ytPlayer
                            .getCurrentTime();


                    canal.offset =
                        atual;


                    const seek =
                        canal.querySelector(
                            ".seek"
                        );


                    seek.value =
                        atual;


                    atualizarTempoCanal(
                        canal,
                        atual
                    );

                } catch(e) {}

            }


            /* ÁUDIO LOCAL */

            else if (
                canal.audioBuffer &&
                canal.playing &&
                audioContext
            ) {

                const posicao =
                    audioContext.currentTime -
                    canal.startTime;


                canal.offset =
                    posicao;


                const seek =
                    canal.querySelector(
                        ".seek"
                    );


                seek.value =
                    posicao;


                atualizarTempoCanal(
                    canal,
                    posicao
                );
            }

        }
    );


    requestAnimationFrame(
        atualizarRelogio
    );
}


atualizarRelogio();

/* =========================================================
   REMOVER CANAL
========================================================= */

function removerCanal(
    canal
) {

    const nome =
        canal.querySelector(
            ".nome"
        ).value;


    if (
        !confirm(
            "Remover o canal '" +
            nome +
            "'?"
        )
    )
        return;


    if (
        canal.source
    ) {

        try {

            canal.source.stop();

        } catch(e) {}
    }


    if (
        canal.ytPlayer
    ) {

        try {

            canal.ytPlayer.stopVideo();

        } catch(e) {}
    }


    const indice =
        canais.indexOf(
            canal
        );


    if (
        indice !== -1
    ) {

        canais.splice(
            indice,
            1
        );
    }


    canal.remove();


    atualizarContador();

    atualizarSolos();

    salvarAutomaticamente();
}

function atualizarContador() {

/* =========================================================
   COPIAR
========================================================= */

function copiarCanal(
    canal
) {

    canalCopiado = {

        fader:
            canal.querySelector(
                ".fader"
            ).value,

        pan:
            canal.querySelector(
                ".pan"
            ).value,

        mute:
            canal.querySelector(
                ".mute"
            ).classList.contains(
                "ativo"
            ),

        solo:
            canal.querySelector(
                ".solo"
            ).classList.contains(
                "ativo"
            ),

        knobs:
            Array.from(
                canal.querySelectorAll(
                    ".knob"
                )
            ).map(
                k =>
                    Number(
                        k.dataset.valor
                    )
            )
    };


    alert(
        "Configuração copiada."
    );
}


/* =========================================================
   COLAR
========================================================= */

function colarCanal(
    canal
) {

    if (
        !canalCopiado
    ) {

        alert(
            "Primeiro copie um canal."
        );

        return;
    }


    canal.querySelector(
        ".fader"
    ).value =
        canalCopiado.fader;


    canal.querySelector(
        ".valor-fader"
    ).textContent =
        canalCopiado.fader +
        "%";


    canal.querySelector(
        ".pan"
    ).value =
        canalCopiado.pan;


    canal.querySelector(
        ".mute"
    ).classList.toggle(
        "ativo",
        canalCopiado.mute
    );


    canal.classList.toggle(
        "mutado",
        canalCopiado.mute
    );


    canal.querySelector(
        ".solo"
    ).classList.toggle(
        "ativo",
        canalCopiado.solo
    );


    const knobs =
        canal.querySelectorAll(
            ".knob"
        );


    canalCopiado.knobs.forEach(
        (valor, i) => {

            if (
                knobs[i]
            ) {

                knobs[i].dataset.valor =
                    valor;


                atualizarVisualKnob(
                    knobs[i]
                );
            }
        }
    );


    aplicarControlesCanal(
        canal
    );


    atualizarSolos();


    if (
        canal.ytPlayer
    ) {

        try {

            if (
                canalCopiado.mute
            ) {

                canal.ytPlayer.mute();

            } else {

                canal.ytPlayer.unMute();

                canal.ytPlayer.setVolume(
                    Number(
                        canalCopiado.fader
                    )
                );
            }

        } catch(e) {}
    }


    salvarAutomaticamente();


    alert(
        "Configuração colada."
    );
}


/* =========================================================
   PLAY TODOS
========================================================= */

async function playTodos() {

    await iniciarAudio();


    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.playVideo();

                } catch(e) {}

                return;
            }


            if (
                canal.audioBuffer &&
                !canal.playing
            ) {

                iniciarCanalNaPosicao(
                    canal,
                    canal.offset || 0
                );
            }

        }
    );
}


/* =========================================================
   PAUSAR TODOS
========================================================= */

function pausarTodos() {

    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.pauseVideo();

                } catch(e) {}
            }


            if (
                canal.audioBuffer &&
                canal.playing
            ) {

                pausarCanal(
                    canal
                );
            }

        }
    );


    salvarAutomaticamente();
}


/* =========================================================
   PARAR TODOS
========================================================= */

function pararTodos() {

    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.stopVideo();

                } catch(e) {}

            }


            if (
                canal.source
            ) {

                try {

                    canal.source.stop();

                } catch(e) {}
            }


            canal.playing =
                false;


            canal.offset =
                0;


            const seek =
                canal.querySelector(
                    ".seek"
                );


            if (
                seek
            ) {

                seek.value =
                    0;
            }


            atualizarTempoCanal(
                canal,
                0
            );


            atualizarBotaoPlay(
                canal
            );

        }
    );


    salvarAutomaticamente();
}


/* =========================================================
   SINCRONIZAR
========================================================= */

function sincronizarTodos() {

    let maiorPosicao = 0;


    canais.forEach(
        canal => {

            if (
                canal.playing &&
                canal.offset > maiorPosicao
            ) {

                maiorPosicao =
                    canal.offset;
            }

        }
    );


    canais.forEach(
        canal => {

            if (
                canal.ytPlayer
            ) {

                try {

                    canal.ytPlayer.seekTo(
                        maiorPosicao,
                        true
                    );

                } catch(e) {}

            }


            else if (
                canal.audioBuffer
            ) {

                canal.offset =
                    Math.min(
                        maiorPosicao,
                        canal.audioBuffer.duration
                    );


                if (
                    canal.playing
                ) {

                    reiniciarCanalNaPosicao(
                        canal,
                        canal.offset
                    );
                }
            }

        }
    );


    salvarAutomaticamente();
}

/* =========================================================
   SALVAR CENA
========================================================= */

function salvarCena() {

    const campo =
        document.getElementById(
            "nomeCena"
        );


    const nome =
        campo.value.trim();


    if (
        !nome
    ) {

        alert(
            "Digite um nome para a cena."
        );

        return;
    }


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    cenas[nome] =
        obterEstado();


    localStorage.setItem(
        "mesaSomCenas",
        JSON.stringify(
            cenas
        )
    );

        "";


    atualizarListaCenas();


    alert(
        "Cena salva com sucesso!"

/* =========================================================
   LISTAR CENAS
========================================================= */

function atualizarListaCenas() {

    const lista =
        document.getElementById(
            "listaCenas"
        );


    lista.innerHTML =
        "";


    const cenas =
        JSON.parse(
            localStorage.getItem(
                "mesaSomCenas"
            ) || "{}"
        );


    Object.keys(
        cenas
    ).forEach(
        nome => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "item-cena";


            item.innerHTML = `

                <span>
                    ${nome}
                </span>

                <span>

                    <button>
                        CARREGAR
                    </button>

                    <button>
                        EXCLUIR
                    </button>

                </span>

            `;


            const botoes =
                item.querySelectorAll(
                    "button"
                );


            botoes[0].onclick =
                function() {

                    carregarCena(
                        cenas[nome]
                    );

                };


            botoes[1].onclick =
                function() {

                    if (
                        confirm(
                            "Excluir esta cena?"
                        )
                    ) {

                        delete cenas[nome];


                        localStorage.setItem(
                            "mesaSomCenas",
                            JSON.stringify(
                                cenas
                            )
                        );


                        atualizarListaCenas();
                    }

                };


            lista.appendChild(
                item
            );

        }
    );
}


/* =========================================================
   CARREGAR CENA
========================================================= */

function carregarCena(
    estado
) {

    if (!estado)
        return;


    /* MASTER */

    const masterFader =
        document.getElementById(
            "masterFader"
        );


    masterFader.value =
        estado.masterFader;


    document.getElementById(
        "masterValor"
    ).textContent =
        estado.masterFader +
        "%";


    const masterMute =
        document.getElementById(
            "masterMute"
        );


    masterMute.classList.toggle(
        "ativo",
        estado.masterMute
    );


    if (
        estado.masterEQ
    ) {

        const knobs =
            document.querySelectorAll(
                ".master .knob"
            );


        estado.masterEQ.forEach(
            (valor, i) => {

                if (
                    knobs[i]
                ) {

                    knobs[i].dataset.valor =
                        valor;


                    atualizarVisualKnob(
                        knobs[i]
                    );


                    aplicarMasterKnob(
                        knobs[i],
                        valor
                    );
                }
            }
        );
    }


    /* CANAIS */

    estado.canais.forEach(
        (dados, i) => {

            if (
                !canais[i]
            )
                return;


            const canal =
                canais[i];


            canal.querySelector(
                ".nome"
            ).value =
                dados.nome;


            canal.querySelector(
                ".fader"
            ).value =
                dados.fader;


            canal.querySelector(
                ".valor-fader"
            ).textContent =
                dados.fader +
                "%";


            canal.querySelector(
                ".pan"
            ).value =
                dados.pan;


            canal.querySelector(
                ".mute"
            ).classList.toggle(
                "ativo",
                dados.mute
            );


            canal.classList.toggle(
                "mutado",
                dados.mute
            );


            canal.querySelector(
                ".solo"
            ).classList.toggle(
                "ativo",
                dados.solo
            );


            const knobs =
                canal.querySelectorAll(
                    ".knob"
                );


            if (
                dados.knobs
            ) {

                dados.knobs.forEach(
                    (valor, k) => {

                        if (
                            knobs[k]
                        ) {

                            knobs[k].dataset.valor =
                                valor;


                            atualizarVisualKnob(
                                knobs[k]
                            );

                        }

                    }
                );
            }


            aplicarControlesCanal(
                canal
            );


            if (
                canal.ytPlayer &&
                dados.youtubeUrl
            ) {

                try {

                    canal.ytPlayer.seekTo(
                        dados.offset || 0,
                        true
                    );

                } catch(e) {}
            }

        }
    );


    aplicarVolumeMaster();

    atualizarSolos();

    salvarAutomaticamente();
}
